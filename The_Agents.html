<style>
  /* ESKİ RENK PALETİ (kullanıcı "sayfa rengini eskiye döndür" derse buraya dönülecek):
  :root{
    --navy-deep:#0E1A2E;
    --navy:#1B365D;
    --navy-card:#152744;
    --gold:#D4AF37;
    --gold-soft:#E8CE7A;
    --cyber:#33FFB0;
    --cyber-dim:#1E8F6E;
    --ink:#E9EEF6;
    --ink-dim:#8FA3C0;
    --danger:#E4536B;
  }
  body background eskisi:
    radial-gradient(circle at 15% 0%, rgba(51,255,176,0.06), transparent 40%),
    radial-gradient(circle at 85% 100%, rgba(212,175,55,0.08), transparent 45%),
    var(--navy-deep);
  */
  :root{
    --navy-deep:#0B0F17;
    --navy:#161C2B;
    --navy-card:#131A28;
    --gold:#8B5CF6;
    --gold-soft:#C4A6FF;
    --cyber:#8CE84A;
    --cyber-dim:#5FA82E;
    --ink:#E9EEF6;
    --ink-dim:#93A0B8;
    --danger:#E4536B;
  }
  *{box-sizing:border-box;}
  body{
    background:
      radial-gradient(circle at 12% 0%, rgba(140,232,74,0.10), transparent 42%),
      radial-gradient(circle at 88% 12%, rgba(139,92,246,0.12), transparent 45%),
      radial-gradient(circle at 50% 100%, rgba(140,232,74,0.06), transparent 50%),
      var(--navy-deep);
    color:var(--ink);
    font-family:'Oswald',sans-serif;
    min-height:100vh;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  .card{
    background:var(--navy-card);
    border:1px solid rgba(212,175,55,0.18);
    border-radius:2px;
  }
  .gold-line{border-color:rgba(212,175,55,0.35);}
  input[type="text"], input[type="email"], input[type="password"], input[type="file"],
  input[type="number"], input:not([type]), select, textarea{
    background:#F3F4F6;
    color:#111827;
    border:1px solid rgba(212,175,55,0.3);
    border-radius:2px;
  }
  input[type="text"]::placeholder, input[type="email"]::placeholder,
  input[type="password"]::placeholder, textarea::placeholder{
    color:#6B7280;
  }
  select option{
    background:#F3F4F6;
    color:#111827;
  }
  input[type="text"]:focus, input[type="email"]:focus, input[type="password"]:focus,
  select:focus, textarea:focus{
    outline:none;
    border-color:var(--gold);
  }
  .btn{
    font-family:'Oswald',sans-serif;
    letter-spacing:0.03em;
    border-radius:2px;
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
  }
  .btn:active{transform:scale(0.97);}
  @keyframes btnPulseFeedback{
    0%{ transform:scale(1); filter:brightness(1); }
    40%{ transform:scale(0.93); filter:brightness(1.35); box-shadow:0 0 26px rgba(212,175,55,0.9); }
    100%{ transform:scale(1); filter:brightness(1); }
  }
  .btn-pulse{ animation:btnPulseFeedback 0.4s ease; }
  .btn-gold{background:var(--gold);color:#1a1204;}
  .btn-gold:hover{box-shadow:0 0 18px rgba(212,175,55,0.5);}
  .btn-cyber{background:var(--cyber);color:#04241a;}
  .btn-cyber:hover{box-shadow:0 0 18px rgba(51,255,176,0.5);}
  .btn-danger{background:var(--danger);color:#2a0510;}
  .btn-danger:hover{box-shadow:0 0 18px rgba(228,83,107,0.45);}
  .btn-ghost{background:transparent;border:1px solid rgba(233,238,246,0.25);color:var(--ink);}
  .btn-ghost:hover{border-color:var(--gold);color:var(--gold);}
  .btn-selected-green{background:var(--cyber);color:#04241a;border:1px solid var(--cyber);}
  .btn-selected-red{background:var(--danger);color:#2a0510;border:1px solid var(--danger);}
  .btn-selected-yellow{background:var(--gold-soft);color:#3a2a04;border:1px solid var(--gold-soft);}
  .btn-selected-gray{background:rgba(233,238,246,0.28);color:var(--ink);border:1px solid rgba(233,238,246,0.4);}
  .btn:disabled{opacity:0.35;cursor:not-allowed;box-shadow:none!important;transform:none!important;}
  .tag{font-family:'JetBrains Mono',monospace;font-size:0.68rem;letter-spacing:0.06em;padding:2px 8px;border-radius:2px;}
  .tag-active{background:rgba(51,255,176,0.14);color:var(--cyber);border:1px solid rgba(51,255,176,0.4);}
  .tag-shadow{background:rgba(228,83,107,0.14);color:var(--danger);border:1px solid rgba(228,83,107,0.4);}
  .tag-agent{background:rgba(212,175,55,0.14);color:var(--gold);border:1px solid rgba(212,175,55,0.4);}
  .envelope{
    width:280px;height:196px;margin:0 auto;position:relative;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .3s ease;
    filter:drop-shadow(0 10px 22px rgba(0,0,0,0.55));
  }
  .envelope:hover{transform:translateY(-4px) scale(1.02);}
  .seal{
    width:64px;height:64px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #c9a227, #7a5c0f);
    display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;font-size:0.6rem;font-weight:700;
    color:#2a1c04;text-align:center;line-height:1.1;
    box-shadow:0 0 0 3px rgba(0,0,0,0.25) inset;
  }
  .letter-reveal{animation:reveal .5s ease forwards;}
  @keyframes reveal{from{opacity:0;transform:translateY(12px) scale(0.97);}to{opacity:1;transform:translateY(0) scale(1);}}
  .progress-track{background:rgba(233,238,246,0.08);border-radius:2px;overflow:hidden;}
  .progress-fill{background:linear-gradient(90deg,var(--cyber-dim),var(--cyber));height:100%;transition:width .5s ease;}
  .thermo-track{background:rgba(233,238,246,0.08);border-radius:999px;overflow:hidden;}
  .thermo-fill{background:linear-gradient(90deg,var(--gold),var(--cyber));height:100%;transition:width .6s ease;}
  nav a{font-family:'JetBrains Mono',monospace;font-size:0.72rem;letter-spacing:0.08em;}
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:rgba(212,175,55,0.35);border-radius:4px;}
  .confetti{position:fixed;top:-20px;width:8px;height:14px;opacity:0.9;z-index:60;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:0.3;}}
  input[type=text],input[type=number],input[type=password],select{
    background:rgba(233,238,246,0.06);
    border:1px solid rgba(233,238,246,0.2);
    color:var(--ink);border-radius:2px;
  }
  input[type=text]:focus,input[type=number]:focus,input[type=password]:focus,select:focus{outline:none;border-color:var(--cyber);}
  table{border-collapse:collapse;}
  th{font-family:'JetBrains Mono',monospace;font-size:0.68rem;letter-spacing:0.05em;color:var(--ink-dim);text-transform:uppercase;}
  td,th{padding:8px 10px;}
  tr.row-shadow{opacity:0.55;}
  .glow-title{text-shadow:0 0 24px rgba(212,175,55,0.25);}
  .app-footer{
    margin-top:2.5rem;
    padding:14px 20px 22px;
    border-top:1px solid rgba(212,175,55,0.15);
    opacity:0.7;
    font-family:'Oswald',sans-serif;
    font-size:0.72rem;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .app-footer .signature{
    font-style:italic;
    font-family:'JetBrains Mono',monospace;
    color:var(--gold-soft);
    font-weight:600;
  }
  .install-btn{
    display:inline-flex;align-items:center;gap:6px;
  }
  .headline-cool{
    font-family:'Bungee',cursive;
    letter-spacing:0.01em;
    color:var(--gold-soft);
    text-shadow:0 0 18px rgba(212,175,55,0.45), 0 0 36px rgba(51,255,176,0.15);
    line-height:1.3;
  }
  .matrix-text{
    font-family:'Share Tech Mono',monospace;
    letter-spacing:0.35em;
    color:var(--cyber);
    text-shadow:0 0 10px rgba(51,255,176,0.7), 0 0 20px rgba(51,255,176,0.35);
  }
</style>
</head>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBxBzCkrJ9D8Uf9EcVGC80WcD116BtoUI4",
  authDomain: "the-agents-69182.firebaseapp.com",
  databaseURL: "https://the-agents-69182-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "the-agents-69182",
  storageBucket: "the-agents-69182.firebasestorage.app",
  messagingSenderId: "516259979836",
  appId: "1:516259979836:web:868a36a1551cb2e9d61939"
};

const USE_LOCAL_STORAGE = false;

let db = null;
let firebaseReady = false;
if(!USE_LOCAL_STORAGE){
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    firebaseReady = true;
  }catch(e){
    console.warn("Firebase başlatılamadı — config'i doldurmanız gerekiyor.", e);
  }
}

const APP_PREFIX = "araştırmacılar-ajanlar";
const CURRENT_CLASS_STORAGE_KEY = `${APP_PREFIX}:current-class`;

const _memStore = {};
function safeGet(store, key){ try{ return store.getItem(key); }catch(e){ return _memStore[key] ?? null; } }
function safeSet(store, key, val){ try{ store.setItem(key, val); }catch(e){ _memStore[key] = val; } }
function safeRemove(store, key){ try{ store.removeItem(key); }catch(e){ delete _memStore[key]; } }

function generateClassCode(){
  return Math.random().toString(36).slice(2,8).toUpperCase();
}
function getStoredClassCode(){
  return safeGet(localStorage, CURRENT_CLASS_STORAGE_KEY);
}
let ACTIVE_CLASS_CODE = getStoredClassCode() || generateClassCode();
safeSet(localStorage, CURRENT_CLASS_STORAGE_KEY, ACTIVE_CLASS_CODE);

let ROOT = ACTIVE_CLASS_CODE;
let LOCAL_KEY = `${APP_PREFIX}:class:${ACTIVE_CLASS_CODE}`;

function ref(path){ return db.ref(`${ROOT}/${path}`); }

function loadLocalState(){
  try{
    const raw = localStorage.getItem(LOCAL_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ console.warn('Yerel veri okunamadı', e); }
  return null;
}
function persistLocalState(){
  try{
    localStorage.setItem(LOCAL_KEY, JSON.stringify({ students: State.students, meta: State.meta }));
  }catch(e){ console.warn('Yerel veri kaydedilemedi', e); }
}

function simpleHash(str){
  let h = 0;
  for(let i=0;i<String(str).length;i++){ h = (h*31 + String(str).charCodeAt(i)) >>> 0; }
  return h.toString(36);
}

// Öğretmen/Admin girişi artık Firebase Authentication ile yapılır (e-posta + şifre).
// Hesaplar SADECE admin panelinden oluşturulur; kendi kendine kayıt YOKTUR.
const ADMIN_UID = "eDTGhzccveNDugVZ9z0e2HmEhqr2";
let auth = (!USE_LOCAL_STORAGE && firebaseReady) ? firebase.auth() : null;
let teacherAuthState = auth ? 'pending' : 'guest'; // 'pending' | 'authed' | 'guest'
let currentTeacherUid = null;
let currentTeacherRecord = null; // {email, isAdmin, suspended, ...}

function isTeacherAuthed(){ return teacherAuthState === 'authed'; }
function isCurrentUserAdmin(){ return !!(currentTeacherRecord && currentTeacherRecord.isAdmin); }

function setupPresence(uid){
  if(!db) return;
  const myConnRef = db.ref('presence/'+uid);
  db.ref('.info/connected').on('value', function(snap){
    if(snap.val()===true){
      myConnRef.onDisconnect().set({ online:false, lastSeen: firebase.database.ServerValue.TIMESTAMP });
      myConnRef.set({ online:true, lastSeen: firebase.database.ServerValue.TIMESTAMP });
    }
  });
}

if(auth){
  auth.onAuthStateChanged(function(user){
    if(!user){
      teacherAuthState = 'guest';
      currentTeacherUid = null;
      currentTeacherRecord = null;
      render();
      return;
    }
    currentTeacherUid = user.uid;
    const isAdmin = (user.uid === ADMIN_UID);
    db.ref('admin/teachers/'+user.uid).once('value').then(function(snap){
      const rec = snap.val();
      const codesCount = Object.keys((rec && rec.classCodes) || {}).length;
      const noAgentsAccess = !isAdmin && rec && rec.maxClasses === 0 && codesCount === 0;
      if(!isAdmin && (!rec || rec.suspended || noAgentsAccess)){
        teacherAuthState = 'guest';
        currentTeacherUid = null;
        currentTeacherRecord = null;
        auth.signOut();
        if(noAgentsAccess){
          alert('Bu hesabın The Agents\'ı kullanma izni yok. Okul yöneticinizle iletişime geçin.');
        }
        render();
        return;
      }
      currentTeacherRecord = isAdmin ? { email: user.email, isAdmin:true, suspended:false } : Object.assign({isAdmin:false}, rec);
      teacherAuthState = 'authed';
      resolveAndActivateOwnedClass(user.uid, rec||{});
      setupPresence(user.uid);
      render();
    });
  });
}

// Giriş yapan öğretmeni HER ZAMAN kendi sahip olduğu sınıfa yönlendirir —
// tarayıcıda kalıntı bir kod olsa bile başka bir öğretmenin sınıfına asla girilmez.
function resolveAndActivateOwnedClass(uid, rec){
  const codes = Object.keys(rec.classCodes || {});
  const targetCode = (rec.activeClassCode && codes.includes(rec.activeClassCode)) ? rec.activeClassCode : codes[0];
  if(targetCode){
    activateClass(targetCode);
    return;
  }
  provisionUniqueClass(uid, false);
}

function loginTeacher(){
  const email = (document.getElementById('teacherEmail')||{}).value?.trim();

}

function getSecondaryAuth(){
  let secondaryApp;
  try{ secondaryApp = firebase.app('Secondary'); }

}

function attachAdminListeners(){

function adminCreateTeacherSubmit(){
  const emailEl = document.getElementById('newTeacherEmail');
  const nameEl = document.getElementById('newTeacherName');
  const pwEl = document.getElementById('newTeacherPw');
  const maxClassesEl = document.getElementById('newTeacherMaxClasses');
  const err = document.getElementById('adminCreateError');
  if(err) err.textContent = '';
  const email = (emailEl.value||'').trim().toLowerCase();
  const name = nameEl.value.trim();
  const pw = pwEl.value;
  const maxClassesRaw = maxClassesEl ? maxClassesEl.value.trim() : '';
  if(!email){ if(err) err.textContent = 'E-posta zorunlu.'; return; }
  if(pw && pw.length < 6){ if(err) err.textContent = 'Şifre en az 6 karakter olmalı.'; return; }
  let maxClasses = null;
  if(maxClassesRaw !== ''){
    maxClasses = parseInt(maxClassesRaw, 10);
    if(!Number.isInteger(maxClasses) || maxClasses < 0){ if(err) err.textContent = 'İzin verilecek sınıf sayısı 0 veya daha büyük bir tam sayı olmalı (0 = bu öğretmen The Agents\'ı kullanamaz; boş bırakılırsa sınırsız olur).'; return; }
  }
  // Bu e-posta ile zaten paylaşımlı bir öğretmen hesabı var mı? (ClassClans
  // tarafında veya daha önce The Agents'ta oluşturulmuş olabilir.)
  db.ref('admin/teachers').orderByChild('email').equalTo(email).once('value').then(function(q){
    const val = q.val();
    const existingUid = val ? Object.keys(val)[0] : null;
    if(existingUid){
      const update = {};
      if(name) update.displayName = name;
      if(maxClasses !== null) update.maxClasses = maxClasses;
      // Badge Bank kaydı henüz yoksa otomatik 0 sınıfla oluştur (varsa dokunma)
      if(val[existingUid].bbMaxClasses === undefined) update.bbMaxClasses = 0;
      return db.ref('admin/teachers/'+existingUid).update(update).then(function(){
        emailEl.value=''; nameEl.value=''; pwEl.value=''; if(maxClassesEl) maxClassesEl.value='';
        alert('Bu e-posta zaten kayıtlı bir hesaba aitti — şifresi değişmedi, sadece The Agents için izin verilen sınıf sayısı güncellendi: '+email);
      });
    }
    if(!pw){ if(err) err.textContent = 'Bu e-posta için henüz hesap yok; lütfen bir şifre belirleyin.'; return; }
    const secAuth = getSecondaryAuth();
    return secAuth.createUserWithEmailAndPassword(email, pw).then(function(cred){
      const newUid = cred.user.uid;
      return secAuth.signOut().then(function(){
        // Yeni hesap: ClassClans tarafı da AYNI sınıf sayısıyla başlasın (siz
        // isterseniz sonradan ClassClans'ın kendi panelinden bağımsız olarak
        // değiştirebilirsiniz — bu satır sadece BAŞLANGIÇ değeridir).
        const record = { email, displayName: name || email, suspended:false, createdAt: Date.now(), classCodes:{} };
        if(maxClasses !== null) record.maxClasses = maxClasses;
        record.ccMaxClasses = maxClasses;
        record.wnMaxClasses = maxClasses; // Who's Next? için de aynı başlangıç sınıf sayısı
        record.bbMaxClasses = 0; // Badge Bank: otomatik 0 sınıf (yönetici BadgeBank.html#admin panelinden açar)
        return db.ref('admin/teachers/'+newUid).set(record);
      });
    }).then(function(){
      emailEl.value=''; nameEl.value=''; pwEl.value=''; if(maxClassesEl) maxClassesEl.value='';
      sendWelcomeEmail(email, name, pw).then(function(){
        alert('Öğretmen hesabı oluşturuldu ve hoş geldiniz e-postası gönderildi: '+email);
      }).catch(function(emailErr){
        alert('Öğretmen hesabı oluşturuldu, ancak hoş geldiniz e-postası gönderilemedi.\n\nHata: '+(emailErr && (emailErr.text||emailErr.message) || emailErr));
      });
    });
  }).catch(function(e){
    if(err) err.textContent = 'Hata: '+(e.message||e);
  });
}

// Akıllı tahta şifresi HER SINIF için ayrıdır (LOCAL_KEY'e bağlı, sınıf değişince fonksiyonlar güncel anahtarı kullanır).
function boardPassKey(){ return `${LOCAL_KEY}:tahta-sifre`; }
function boardSessionKey(){ return `${LOCAL_KEY}:tahta-oturum`; }
function hasBoardPassword(){ return !!safeGet(localStorage, boardPassKey()); }
function setBoardPassword(pw){ safeSet(localStorage, boardPassKey(), simpleHash(pw)); }
function checkBoardPassword(pw){ return safeGet(localStorage, boardPassKey()) === simpleHash(pw); }
function isBoardAuthed(){ return safeGet(sessionStorage, boardSessionKey()) === '1'; }
function setBoardAuthed(v){
  if(v) safeSet(sessionStorage, boardSessionKey(), '1');
  else safeRemove(sessionStorage, boardSessionKey());
}

function checkStudentPassword(id, pw){
  const s = State.students[id];
  if(!s) return false;
  if(!s.passwordHash) return true;
  return s.passwordHash === simpleHash(pw);
}

<!-- ================= STATE & PUANLAMA MANTIĞI ================= -->
<script>
function defaultMeta(){
  return {
    currentWeek: 1,
    hintThreshold: 150,
    hintUnlocked: false,
    rolesAssigned: false,
    council: { active:false, votes:{}, lastResult:null },
    councilLog: {},
    sabotage: { active:false, week:null, moves:{}, resolved:false },
    sabotageLog: {},
    lottery: { winners:[], ranAt:null },
    gameEnded: false,
    winner: null,
    winReason: null,
    questionBank: [],
    microtest: { week: 1, mode: null, assignments: {}, responded: {} },
    currentHint: null,
  };
}
const State = {
  students: {},
  meta: defaultMeta(),
  selectedStudent: null,
  envelopeOpen: false,
  teacherTab: 'puanlama',
  teacherViewWeek: null,
  statSelectedStudent: null,
  awaitingWinnerChoice: false,
  lastLotteryShown: null,
  lotteryRevealed: [],
  composingHint: false,
};

function uid(){ return 'id-' + Math.random().toString(36).slice(2,10); }

// 3-13 öğrenci: 2 ajan · 14-18 öğrenci: 3 ajan · 19-24 öğrenci: 4 ajan
function agentCountFor(n){
  if(n>=19) return 4;
  if(n>=14) return 3;
  if(n>=3) return 2;
  return 0;
}

function computeWeeklyTotal(w){
  if(!w) return 0;
  const hw = {full:1.0, partial:0.0, none:-1.0}[w.homework] ?? 0;
  const q1 = w.q1===true?1.0:(w.q1===false?-0.25:0);
  const q2 = w.q2===true?1.0:(w.q2===false?-0.25:0);
  const secret = w.secretTask ? 1.5 : 0;
  return +(hw+q1+q2+secret).toFixed(2);
}
function weeklyBreakdown(w){
  if(!w) return {hw:0, micro:0, secret:0, total:0};
  const hw = {full:1.0, partial:0.0, none:-1.0}[w.homework] ?? 0;
  const q1 = w.q1===true?1.0:(w.q1===false?-0.25:0);
  const q2 = w.q2===true?1.0:(w.q2===false?-0.25:0);
  const micro = +(q1+q2).toFixed(2);
  const secret = w.secretTask ? 1.5 : 0;
  return { hw:+hw.toFixed(2), micro, secret:+secret.toFixed(2), total: computeWeeklyTotal(w) };
}
function isFullWeek(w){
  return w && w.homework==='full' && w.q1===true && w.q2===true && w.secretTask===true;
}
function totalScore(student){
  let sum = 0;
  Object.values(student.weekly||{}).forEach(w=>{ sum += computeWeeklyTotal(w); });
  return +sum.toFixed(2);
}
function totalBreakdown(student){
  let hw=0, micro=0, secret=0;
  Object.values(student.weekly||{}).forEach(w=>{
    const b = weeklyBreakdown(w);
    hw += b.hw; micro += b.micro; secret += b.secret;
  });
  return { hw:+hw.toFixed(2), micro:+micro.toFixed(2), secret:+secret.toFixed(2), total:+(hw+micro+secret).toFixed(2) };
}
function classTotal(){
  return Object.values(State.students).reduce((s,st)=>s+totalScore(st),0);
}

// --- Sabotaj sonuçlanana kadar o haftanın puanını öğrenci/tahta'dan gizleyen yardımcılar ---
function isCurrentWeekRevealed(){
  const sab = State.meta.sabotage;
  return !!(sab && sab.week === State.meta.currentWeek && sab.resolved);
}
function visibleWeeklyKeys(student){
  const revealed = isCurrentWeekRevealed();
  const curWeek = State.meta.currentWeek;
  return Object.keys(student.weekly||{}).filter(wk=>{
    const w = Number(wk);
    if(w < curWeek) return true;
    if(w === curWeek) return revealed;
    return false;
  });
}
function visibleTotalScore(student){
  let sum = 0;
  visibleWeeklyKeys(student).forEach(wk=>{ sum += computeWeeklyTotal(student.weekly[wk]); });
  return +sum.toFixed(2);
}
function visibleTotalBreakdown(student){
  let hw=0, micro=0, secret=0;
  visibleWeeklyKeys(student).forEach(wk=>{
    const b = weeklyBreakdown(student.weekly[wk]);
    hw += b.hw; micro += b.micro; secret += b.secret;
  });
  return { hw:+hw.toFixed(2), micro:+micro.toFixed(2), secret:+secret.toFixed(2), total:+(hw+micro+secret).toFixed(2) };
}
function visibleTicketsFor(student){
  let t = 0;
  visibleWeeklyKeys(student).forEach(wk=>{
    const w = student.weekly[wk];
    if(w.homework==='full') t++;
    if(w.secretTask) t++;
  });
  return t;
}
function visibleClassTotal(){
  return Object.values(State.students).reduce((s,st)=>s+visibleTotalScore(st),0);
}
function ticketsFor(student){
  let t = 0;
  Object.values(student.weekly||{}).forEach(w=>{
    if(w.homework==='full') t++;
    if(w.secretTask) t++;
  });
  return t;
}

// Diriliş ilerlemesi: yalnızca ELENDİKTEN SONRAKİ haftalar sayılır.
// Geri dönüş (diriliş) hakkı yalnızca Araştırmacılar içindir; elenen Ajanlar bu haktan yararlanamaz.
function resurrectionStreak(student){
  if(student.role!=='arastirmaci') return 0;
  if(student.status!=='shadow' || student.eliminatedAtWeek==null) return 0;
  let streak=0, best=0;
  for(let w=student.eliminatedAtWeek+1; w<=State.meta.currentWeek; w++){
    const ww = student.weekly?.[String(w)];
    if(isFullWeek(ww)) streak++; else streak=0;
    best = Math.max(best, streak);
  }
  return best;
}
function hasResurrectionCard(student){ return resurrectionStreak(student) >= 2; }

// Oyun bitiş şartlarını otomatik kontrol eder (State.meta üzerinde in-place çalışır).
function checkGameEndConditions(){
  if(State.meta.gameEnded) return;
  if(!State.meta.rolesAssigned) return;
  const students = Object.values(State.students);
  const totalAgents = students.filter(s=>s.role==='ajan').length;
  if(totalAgents===0) return;
  const activeAgents = students.filter(s=>s.role==='ajan' && s.status==='active').length;
  const activeResearchers = students.filter(s=>s.role==='arastirmaci' && s.status==='active').length;
  if(activeAgents>0 && activeAgents>=activeResearchers){
    State.meta.gameEnded = true;
    State.meta.winner = 'ajan';
    State.meta.winReason = 'Aktif ajan sayısı aktif araştırmacı sayısına eşit veya fazla oldu.';
  } else if(activeAgents===0){
    State.meta.gameEnded = true;
    State.meta.winner = 'arastirmaci';
    State.meta.winReason = 'Tüm ajanlar elendi.';
  }
}
</script>

<script>
function initSync(cb){
  if(USE_LOCAL_STORAGE){
    const saved = loadLocalState();
    if(saved){
      State.students = saved.students || {};
      State.meta = Object.assign({}, State.meta, saved.meta||{});
    }
    cb && cb(); render(); return;
  }
  if(!firebaseReady){ cb && cb(); render(); return; }
  ref('students').on('value', snap=>{ State.students = snap.val() || {}; render(); });
  ref('meta').on('value', snap=>{ State.meta = Object.assign({}, State.meta, snap.val()||{}); render(); });
}

function saveStudent(id, patch){
  if(USE_LOCAL_STORAGE || !firebaseReady){
    State.students[id] = Object.assign({}, State.students[id], patch);
    persistLocalState(); render(); return;
  }
  ref(`students/${id}`).update(patch);
}
let _envelopeHideTimer = null;
function openEnvelope(id){
  saveStudent(id, { envelopeOpenedAt: Date.now() });
}
function scheduleEnvelopeHide(remainingMs){
  if(_envelopeHideTimer) return;
  _envelopeHideTimer = setTimeout(function(){
    _envelopeHideTimer = null;
    render();
  }, Math.max(0, remainingMs) + 50);
}
function saveWeekly(id, weekId, patch){
  if(USE_LOCAL_STORAGE || !firebaseReady){
    State.students[id] = State.students[id] || {name:'?', weekly:{}};
    State.students[id].weekly = State.students[id].weekly || {};
    State.students[id].weekly[weekId] = Object.assign({}, State.students[id].weekly[weekId], patch);
    persistLocalState(); render(); return;
  }
  ref(`students/${id}/weekly/${weekId}`).update(patch);
}
function saveMeta(patch){
  if(USE_LOCAL_STORAGE || !firebaseReady){
    State.meta = Object.assign({}, State.meta, patch);
    persistLocalState(); render(); return;
  }
  ref('meta').update(patch);
}
function commitState(){
  if(USE_LOCAL_STORAGE || !firebaseReady){
    persistLocalState();
    render();
    return;
  }
  ref('meta').set(State.meta);
  ref('students').set(State.students);
  render();
}
function addStudentDb(name, password){
  const id = uid();
  const data = { name, role:'unassigned', status:'active', weekly:{}, passwordHash: password ? simpleHash(password) : null, eliminatedAtWeek: null };
  if(USE_LOCAL_STORAGE || !firebaseReady){
    State.students[id] = data; persistLocalState(); render(); return;
  }
  ref(`students/${id}`).set(data);
}
function importStudentsFromExcel(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
      if(!rows.length){ alert('Excel dosyasında veri bulunamadı.'); return; }
      const findKey = function(row, candidates){
        const keys = Object.keys(row);
        for(let i=0;i<candidates.length;i++){
          const c = candidates[i].toLocaleLowerCase('tr');
          const k = keys.find(function(k){ return k.trim().toLocaleLowerCase('tr') === c; });
          if(k) return k;
        }
        return null;
      };
      let added = 0;
      const skipped = [];
      rows.forEach(function(row){
        const nameKey = findKey(row, ['Öğrenci Adı','Ogrenci Adi','Öğrenci Adi','Ad Soyad']);
        const pwKey = findKey(row, ['Kişisel Şifre','Kisisel Sifre','Şifre','Sifre']);
        const name = (nameKey ? row[nameKey] : '').toString().trim();
        const pw = (pwKey ? row[pwKey] : '').toString().trim();
        if(!name || pw.length < 4){
          if(name || pw) skipped.push(name || '(isimsiz satır)');
          return;
        }
        addStudentDb(name, pw);
        added++;
      });
      let msg = added + ' öğrenci başarıyla eklendi.';
      if(skipped.length){
        msg += '\n\nEksik/hatalı satırlar (isim boş veya şifre 4 karakterden kısa olduğu için) atlandı: ' + skipped.join(', ');
      }
      alert(msg);
    }catch(err){
      alert('Excel dosyası okunamadı. "Öğrenci Adı" ve "Kişisel Şifre" başlıklı bir tablo olduğundan emin olun.\n\nHata: ' + (err.message || err));
    }
  };
  reader.readAsArrayBuffer(file);
}
function removeStudentDb(id){
  if(USE_LOCAL_STORAGE || !firebaseReady){
    delete State.students[id]; persistLocalState(); render(); return;
  }
  ref(`students/${id}`).remove();
}
function changeStudentPassword(id){
  const s = State.students[id];
  if(!s) return;
  const pw = prompt(`${s.name} için yeni şifre (en az 4 karakter):`);
  if(pw===null) return;
  if(pw.trim().length < 4){ alert('Şifre en az 4 karakter olmalı.'); return; }
  saveStudent(id, { passwordHash: simpleHash(pw.trim()) });
  alert('Şifre güncellendi.');
}
function sendHintMessage(){
  const input = document.getElementById('hintTextInput');
  const text = input ? input.value.trim() : '';
  if(!text){ alert('Lütfen bir ipucu metni yazın.'); return; }
  const newThreshold = +(State.meta.hintThreshold * 2).toFixed(1);
  saveMeta({
    currentHint: { text, sentAt: Date.now() },
    hintThreshold: newThreshold,
  });
  State.composingHint = false;
}
function assignRolesRandom(){
  if(State.meta.rolesAssigned) return;
  const ids = Object.keys(State.students);
  const n = ids.length;
  const agentCount = agentCountFor(n);
  const shuffled = [...ids].sort(()=>Math.random()-0.5);
  const updates = {};
  shuffled.forEach((id,i)=>{
    updates[id] = { role: i<agentCount ? 'ajan' : 'arastirmaci', status:'active' };
  });
  const initialThreshold = Math.round(n * 9.5 * 10) / 10;
  if(USE_LOCAL_STORAGE || !firebaseReady){
    Object.entries(updates).forEach(([id,p])=>{ State.students[id]=Object.assign({},State.students[id],p); });
    State.meta = Object.assign({}, State.meta, {rolesAssigned:true, hintThreshold: initialThreshold});
    persistLocalState(); render(); return;
  }
  Object.entries(updates).forEach(([id,p])=> ref(`students/${id}`).update(p));
  saveMeta({rolesAssigned:true, hintThreshold: initialThreshold});
}
</script>

function pickTwoRandomQuestions(bank){
  if(bank.length <= 2) return bank.map(q=>q.id);
  const pool = [...bank];
  for(let i=pool.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [pool[i],pool[j]] = [pool[j],pool[i]];
  }
  return [pool[0].id, pool[1].id];
}
function sendMicrotestQuestions(){
  const bank = State.meta.questionBank || [];
  if(bank.length < 2){ alert('Soru havuzunda en az 2 soru olmalı.'); return; }
  const assignments = {};
  Object.keys(State.students).forEach(id=>{
    const [q1Id, q2Id] = pickTwoRandomQuestions(bank);
    assignments[id] = { q1Id, q2Id };
  });
  saveMeta({ microtest: { week: State.meta.currentWeek, mode:'digital', assignments, responded:{} } });
}
function setMicrotestManual(){
  saveMeta({ microtest: { week: State.meta.currentWeek, mode:'manual', assignments:{}, responded:{} } });
}
function resetMicrotestMode(){
  saveMeta({ microtest: { week: State.meta.currentWeek, mode:null, assignments:{}, responded:{} } });
}
function microtestProgress(){
  const mt = State.meta.microtest;
  if(!mt || mt.mode!=='digital' || mt.week !== State.meta.currentWeek) return null;
  const allIds = Object.keys(State.students);
  const done = allIds.filter(id=> mt.responded?.[id]?.q1 && mt.responded?.[id]?.q2);
  return { total: allIds.length, done: done.length };
}

}

function compressImageFile(file, maxDim, quality){
  return new Promise(function(resolve, reject){
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = function(e){
      const img = new Image();
      img.onerror = reject;
      img.onload = function(){
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w >= h){ h = Math.round(h * (maxDim / w)); w = maxDim; }
          else { w = Math.round(w * (maxDim / h)); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        try{
          resolve(canvas.toDataURL('image/jpeg', quality));
        }catch(err){ reject(err); }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
function addQuestionFromInputs(){

function startSabotage(){
  if(State.meta.sabotage?.active) return;
  saveMeta({ sabotage: { active:true, week: State.meta.currentWeek, moves:{}, resolved:false } });
}
function applySabotageMoves(){
  const sab = State.meta.sabotage;
  if(!sab) return;
  const weekKey = String(sab.week);
  const moves = sab.moves || {};
  const logEntries = [];
  Object.entries(moves).forEach(([agentId, mv])=>{
    if(!mv.committed) return;
    const agent = State.students[agentId];
    const target = State.students[mv.targetId];
    if(!agent || !target || target.status!=='active') return;
    const aScore = computeWeeklyTotal(agent.weekly?.[weekKey]);
    const tScore = computeWeeklyTotal(target.weekly?.[weekKey]);
    const success = aScore > tScore;
    if(success){
      State.students[mv.targetId] = Object.assign({}, target, {status:'shadow', pendingSabotageNotice:true, eliminatedAtWeek: sab.week});
    }
    logEntries.push({ agentName: agent.name, targetName: target.name, success });
  });
  if(logEntries.length){
    State.meta.sabotageLog = Object.assign({}, State.meta.sabotageLog||{}, { [sab.week]: logEntries });
  }
}
function resolveSabotage(){
  const sab = State.meta.sabotage;
  if(!sab || !sab.active) return;
  applySabotageMoves();
  State.meta = Object.assign({}, State.meta, { sabotage: { active:false, week:sab.week, moves:sab.moves||{}, resolved:true } });
  checkGameEndConditions();
  commitState();
}

function startCouncil(){
  saveMeta({ council: { active:true, votes:{}, lastResult: State.meta.council?.lastResult||null } });
}
function endCouncil(){
  const votes = State.meta.council?.votes || {};
  const counts = {};
  Object.values(votes).forEach(t=>{ counts[t]=(counts[t]||0)+1; });
  let max = 0;
  Object.values(counts).forEach(c=>{ if(c>max) max=c; });
  const eliminated = max>0 ? Object.keys(counts).filter(id=>counts[id]===max) : [];
  const finishedWeek = State.meta.currentWeek;

  eliminated.forEach(id=>{
    if(State.students[id]) State.students[id] = Object.assign({}, State.students[id], {status:'shadow', eliminatedAtWeek: finishedWeek, pendingCouncilNotice:true});
  });

  if(State.meta.sabotage?.active && !State.meta.sabotage?.resolved){
    applySabotageMoves();
  }

  const eliminatedNames = eliminated.map(id=>State.students[id]?.name).filter(Boolean);
  const voteDetails = Object.entries(votes).map(([voterId,targetId])=>({
    voterName: State.students[voterId]?.name || '?',
    targetName: State.students[targetId]?.name || '?',
  }));
  const councilLog = Object.assign({}, State.meta.councilLog||{}, {
    [finishedWeek]: { votes: voteDetails, eliminatedNames, weekId: finishedWeek }
  });

  const newWeek = finishedWeek + 1;
  State.meta = Object.assign({}, State.meta, {
    council: { active:false, votes:{}, lastResult: { eliminatedIds:eliminated, eliminatedNames, weekId: finishedWeek } },
    sabotage: { active:false, week:null, moves:{}, resolved:false },
    currentWeek: newWeek,
    councilLog,
    microtest: { week: newWeek, mode:null, assignments:{}, responded:{} },
  });
  State.teacherViewWeek = newWeek;
  checkGameEndConditions();
  commitState();
}

function handleRunLotteryClick(btn){
  if(!btn || btn.disabled) return;
  btn.disabled = true;
  btn.classList.add('btn-pulse');
  btn.textContent = '🎲 Çekiliş Yapılıyor...';

  setTimeout(function(){ runLottery(); }, 380);
}
function runLottery(){
  if(!State.meta.gameEnded) return;
  const eligible = Object.entries(State.students)
    .filter(([id,s])=>s.status==='shadow')
    .flatMap(([id,s])=>Array(Math.max(ticketsFor(s),0)).fill(s.name));
  if(eligible.length < 1){ saveMeta({ lottery: { winners: [], ranAt: Date.now() } }); return; }
  const winners = new Set();
  const uniqueCount = new Set(eligible).size;
  while(winners.size < Math.min(2, uniqueCount)){
    winners.add(eligible[Math.floor(Math.random()*eligible.length)]);
  }
  saveMeta({ lottery: { winners: [...winners], ranAt: Date.now() } });
}

function exportGameDataToExcel(){
  if(typeof XLSX === 'undefined'){
    alert('Excel kütüphanesi yüklenemedi (internet bağlantınızı kontrol edin). Veriler kaydedilmeden devam edilecek.');

  Object.values(State.students).forEach(s=>{
    const b = totalBreakdown(s);
    summary.push([
      s.name,
      s.role==='ajan'?'Ajan':(s.role==='arastirmaci'?'Araştırmacı':'Atanmadı'),
      s.status==='shadow'?'Gölge':'Aktif',
      b.hw, b.micro, b.secret, b.total, ticketsFor(s)
    ]);
  });
  const ws1 = XLSX.utils.aoa_to_sheet(summary);
  ws1['!cols'] = [{wch:18},{wch:14},{wch:10},{wch:12},{wch:15},{wch:15},{wch:13},{wch:8}];
  XLSX.utils.book_append_sheet(wb, ws1, 'Genel Özet');

  const weekly = [['Öğrenci','Hafta','Ödev Durumu','Soru 1','Soru 2','Gizli Görev','Haftalık Toplam']];
  Object.values(State.students).forEach(s=>{
    const weekKeys = Object.keys(s.weekly||{}).sort((a,b)=>Number(a)-Number(b));
    weekKeys.forEach(wk=>{
      const w = s.weekly[wk];
      weekly.push([
        s.name, Number(wk),
        w.homework==='full'?'Tam':(w.homework==='partial'?'Eksik':(w.homework==='none'?'Yapmadı':'—')),
        w.q1===true?'Doğru':(w.q1===false?'Yanlış':'Boş'),
        w.q2===true?'Doğru':(w.q2===false?'Yanlış':'Boş'),
        w.secretTask?'Yapıldı':'Yapılmadı',
        computeWeeklyTotal(w)
      ]);
    });
  });
  const ws2 = XLSX.utils.aoa_to_sheet(weekly);
  ws2['!cols'] = [{wch:18},{wch:8},{wch:12},{wch:10},{wch:10},{wch:14},{wch:14}];
  XLSX.utils.book_append_sheet(wb, ws2, 'Hafta Hafta Puanlar');

  const council = [['Hafta','Elenenler','Oy Veren','Oy Verilen']];
  const clog = State.meta.councilLog || {};
  Object.keys(clog).sort((a,b)=>Number(a)-Number(b)).forEach(wk=>{
    const entry = clog[wk];
    const elim = (entry.eliminatedNames||[]).join(', ') || 'Kimse elenmedi';
    if((entry.votes||[]).length){
      entry.votes.forEach(v=>{ council.push([Number(wk), elim, v.voterName, v.targetName]); });
    } else {
      council.push([Number(wk), elim, '—', '—']);
    }
  });
  if(council.length===1) council.push(['—','Bu dönemde konsey oylaması hiç yapılmadı','—','—']);
  const ws3 = XLSX.utils.aoa_to_sheet(council);
  ws3['!cols'] = [{wch:8},{wch:26},{wch:16},{wch:16}];
  XLSX.utils.book_append_sheet(wb, ws3, 'Konsey Logları');

  const sab = [['Hafta','Ajan','Hedef','Sonuç']];
  const slog = State.meta.sabotageLog || {};
  Object.keys(slog).sort((a,b)=>Number(a)-Number(b)).forEach(wk=>{
    (slog[wk]||[]).forEach(entry=>{
      sab.push([Number(wk), entry.agentName, entry.targetName, entry.success?'Başarılı':'Engellendi']);
    });
  });
  if(sab.length===1) sab.push(['—','Bu dönemde sabotaj hiç uygulanmadı','—','—']);
  const ws4 = XLSX.utils.aoa_to_sheet(sab);
  ws4['!cols'] = [{wch:8},{wch:16},{wch:16},{wch:12}];
  XLSX.utils.book_append_sheet(wb, ws4, 'Sabotaj Logları');

  const lot = [['Kazananlar','Tarih']];
  if(State.meta.lottery?.winners?.length){
    lot.push([State.meta.lottery.winners.join(' & '), State.meta.lottery.ranAt ? new Date(State.meta.lottery.ranAt).toLocaleString('tr-TR') : '—']);
  } else {
    lot.push(['—','—']);
  }
  const ws5 = XLSX.utils.aoa_to_sheet(lot);
  ws5['!cols'] = [{wch:30},{wch:22}];
  XLSX.utils.book_append_sheet(wb, ws5, 'Piyango');

  const dateStr = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `arastirmacilar-ve-ajanlar-oyun-verileri-${dateStr}.xlsx`);
}

// Benzersiz bir sınıf kodu üretip (Firebase'de çakışma kontrolü yaparak) o öğretmene kaydeder.
function provisionUniqueClass(uid, andNavigate, triesLeft){
  triesLeft = triesLeft==null ? 6 : triesLeft;
  if(!db){ alert('Bağlantı hazır değil, sayfayı yenileyin.'); return; }
  const code = generateClassCode();
  db.ref('admin/classes/'+code).once('value').then(function(snap){
    if(snap.exists()){
      if(triesLeft>0){ provisionUniqueClass(uid, andNavigate, triesLeft-1); return; }
      alert('Benzersiz bir sınıf kodu oluşturulamadı, lütfen tekrar deneyin.');
      return;
    }
    db.ref('admin/classes/'+code).set({ teacherUid: uid, createdAt: Date.now() });
    db.ref('admin/teachers/'+uid+'/classCodes/'+code).set(true);
    db.ref('admin/teachers/'+uid+'/activeClassCode').set(code);
    if(andNavigate) switchToClass(code); else activateClass(code);
  });
}

function createNewClass(){
  if(!currentTeacherUid || !db){ alert('Bağlantı hazır değil.'); return; }
  db.ref('admin/teachers/'+currentTeacherUid).once('value').then(function(snap){
    const t = snap.val() || {};
    const currentCount = Object.keys(t.classCodes || {}).length;
    if(typeof t.maxClasses === 'number' && currentCount >= t.maxClasses){
      alert('Sınıf/oyun oluşturma limitinize ulaştınız ('+currentCount+' / '+t.maxClasses+'). Daha fazla sınıf açabilmek için yöneticinizle iletişime geçin.');
      return;
    }
    if(!confirm('Yeni bir sınıf/oyun oluşturmak istediğinize emin misiniz? Mevcut sınıfın verileri saklı kalır; şimdi boş yeni bir sınıfa geçeceksiniz.')) return;
    provisionUniqueClass(currentTeacherUid, true);
  });
}

// Öğretmen SADECE kendi sahip olduğu sınıflar arasında geçiş yapabilir — başka bir
// öğretmenin sınıfına asla erişemez.
function switchClassPrompt(){
  if(!currentTeacherUid || !db){ alert('Bağlantı hazır değil.'); return; }
  db.ref('admin/teachers/'+currentTeacherUid+'/classCodes').once('value').then(function(snap){
    const codes = Object.keys(snap.val()||{}).filter(function(c){ return c !== ACTIVE_CLASS_CODE; });
    if(codes.length===0){ alert('Başka bir sınıfınız yok. Yeni bir sınıf oluşturmak için "Yeni Sınıf Ekle" butonunu kullanabilirsiniz.'); return; }
    const choice = prompt('Geçmek istediğiniz sınıfın kodunu yazın:\n\nSınıflarınız:\n'+codes.join('\n'), codes[0]);
    if(!choice) return;
    const code = choice.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(!codes.includes(code)){ alert('Bu kod sizin sınıflarınız arasında bulunmuyor.'); return; }
    db.ref('admin/teachers/'+currentTeacherUid+'/activeClassCode').set(code);
    switchToClass(code);
  });
}

function renameClassCode(){
  const input = prompt('Yeni oyun kodunu girin (harf/rakam, 3-12 karakter):', ACTIVE_CLASS_CODE);
  if(!input) return;
  const newCode = input.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(newCode.length<3 || newCode.length>12){ alert('Kod 3-12 karakter arasında olmalı.'); return; }
  if(newCode === ACTIVE_CLASS_CODE) return;
  if(!db){ alert('Bağlantı hazır değil.'); return; }
  const oldCode = ACTIVE_CLASS_CODE;
  db.ref('admin/classes/'+newCode).once('value').then(function(snap){
    if(snap.exists()){
      alert('Bu kod zaten başka bir sınıf tarafından kullanılıyor. Lütfen farklı bir kod deneyin.');
      return Promise.reject('handled');
    }
    return db.ref(oldCode).once('value');
  }).then(function(dataSnap){
    if(!dataSnap) return;
    const data = dataSnap.val();
    return db.ref(newCode).set(data)
      .then(function(){ return db.ref('admin/classes/'+newCode).set({ teacherUid: currentTeacherUid, createdAt: Date.now() }); })
      .then(function(){
        if(!currentTeacherUid) return;
        return db.ref('admin/teachers/'+currentTeacherUid+'/classCodes/'+newCode).set(true)
          .then(function(){ return db.ref('admin/teachers/'+currentTeacherUid+'/classCodes/'+oldCode).remove(); })
          .then(function(){ return db.ref('admin/teachers/'+currentTeacherUid+'/activeClassCode').set(newCode); });
      })
      .then(function(){ return db.ref(oldCode).remove(); })
      .then(function(){
        const oldBoardPass = safeGet(localStorage, `${APP_PREFIX}:class:${oldCode}:tahta-sifre`);
        if(oldBoardPass){
          safeSet(localStorage, `${APP_PREFIX}:class:${newCode}:tahta-sifre`, oldBoardPass);
          safeRemove(localStorage, `${APP_PREFIX}:class:${oldCode}:tahta-sifre`);
        }
        switchToClass(newCode);
      });
  }).catch(function(e){
    if(e === 'handled') return;
    alert('Hata: '+(e.message||e));
  });
}

        <p class="text-sm leading-relaxed">${letterText}</p>
      </div>`;
      scheduleEnvelopeHide(ENVELOPE_REVEAL_MS - elapsed);
    } else {
      window._missionRevealActive = false;
      if(_overlayEl) _overlayEl.style.display = 'none';
      envelopeBlock = '';
    }
  }

  const sabotageNotice = s.pendingSabotageNotice ? `
    <div class="card p-4" style="border-color:var(--danger)">
      <div class="text-sm leading-relaxed">Bu gece Ajanların sabotajına uğradınız ve görevden uzaklaştırılıp Gölge Araştırmacı oldunuz. Fakat üzülmeyin! Görevleri tamamlayarak ekibe geri dönebilirsiniz.</div>
      <button class="btn btn-ghost px-3 py-1 text-xs mt-2" onclick="dismissSabotageNotice('${selectedId}')">Anladım</button>
    </div>` : '';

  const councilNotice = s.pendingCouncilNotice ? `
    <div class="card p-4" style="border-color:var(--danger)">
      <div class="text-sm leading-relaxed">Üzülerek bildiriyorum! Bilim Konseyinin yaptığı oylama sonucunda görevden uzaklaştırıldınız ve ${s.role==='ajan' ? 'Gölge Ajan' : 'Gölge Araştırmacı'} oldunuz.${s.role==='arastirmaci' ? ' Fakat üzülmeyin! Görevleri tamamlayarak ekibe geri dönebilirsiniz.' : ' Oyunu kazanma şansın hala bitmedi. Ödev ve Gizli Görevleri tamamlayarak bilet kazanmaya devam et ve oyun sonu çekilişinde şansını artır!'}</div>
      <button class="btn btn-ghost px-3 py-1 text-xs mt-2" onclick="dismissCouncilNotice('${selectedId}')">Anladım</button>
    </div>` : '';

  const sab = State.meta.sabotage || {};
  let sabotageMoveBlock = '';
  if(s.role==='ajan' && s.status==='active' && sab.active){
    const myMove = sab.moves?.[selectedId];
    const alreadyTargeted = new Set(Object.values(sab.moves||{}).filter(mv=>mv.committed).map(mv=>mv.targetId));
    const targets = ids.filter(id=> State.students[id].role==='arastirmaci' && State.students[id].status==='active' && !alreadyTargeted.has(id));
    if(myMove?.committed){
      sabotageMoveBlock = `
      <div class="card p-4" style="border-color:var(--gold)">
        <div class="font-medium mb-1">Sabotaj Hamleniz Kaydedildi</div>
        <div class="text-sm">Hedef: <b>${State.students[myMove.targetId]?.name||'?'}</b></div>
        <div class="text-xs text-[var(--ink-dim)] mt-1">Sonuç, öğretmen uyguladığında açıklanacak.</div>
        <button class="btn btn-ghost px-3 py-1 text-xs mt-2" onclick="undoSabotageMove()">Hamleyi Geri Al</button>
      </div>`;
    } else {
      sabotageMoveBlock = `
      <div class="card p-4" style="border-color:var(--danger)">
        <div class="font-medium mb-2">🎯 Sabotaj Girişiminde Bulun</div>
        <select id="sabTargetSelect" class="w-full px-2 py-1 mb-2">
          <option value="">— Hedef seçin —</option>
          ${targets.map(id=>`<option value="${id}">${State.students[id].name}</option>`).join('')}
        </select>
        <button class="btn btn-danger px-4 py-2 w-full" onclick="confirmSabotageMove()">Hamleyi Onayla</button>
      </div>`;
    }
  }

  const mt = State.meta.microtest || {};
  let microtestBlock = '';
  if(mt.mode==='digital' && mt.week===State.meta.currentWeek){
    const bank = State.meta.questionBank || [];
    const myAssignment = mt.assignments?.[selectedId] || {};
    const responded = mt.responded?.[selectedId] || {};
    const renderQ = (qKey, qId, label) => {
      if(responded[qKey]){
        return `<div class="card p-4"><div class="font-medium mb-1">${label}</div><div class="text-xs mono" style="color:var(--cyber)">✓ Cevabınız kaydedildi</div></div>`;
      }
      const q = bank.find(x=>x.id===qId);
      if(!q) return '';
      return `
      <div class="card p-4">
        <div class="font-medium mb-2">${label}</div>
        <img src="${q.image}" class="w-full max-h-64 object-contain mb-3" style="background:rgba(255,255,255,0.06)">
        <div class="grid grid-cols-3 gap-2">
          ${['A','B','C','D','E'].map(letter=>`<button class="btn btn-ghost px-2 py-2 text-sm" onclick="submitMicrotestAnswer('${qKey}','${letter}')">${letter}</button>`).join('')}
          <button class="btn btn-ghost px-2 py-2 text-xs col-span-3" onclick="submitMicrotestAnswer('${qKey}', null)">Boş Bırak</button>
        </div>
      </div>`;
    };
    microtestBlock = renderQ('q1', myAssignment.q1Id, 'Mikro Test — Soru 1') + renderQ('q2', myAssignment.q2Id, 'Mikro Test — Soru 2');
  }

  let councilBlock = '';
  if(State.meta.council?.active){
    if(isShadow){
      councilBlock = `<div class="card p-4 text-center text-sm">Şu anda Oylama Açık Fakat Gölgeler Oy Kullanamaz</div>`;
    } else {
      councilBlock = `
      <div class="card p-4">
        <div class="font-medium mb-2">🗳️ Canlı Konsey Oylaması Açık</div>
        <div class="flex gap-2 flex-wrap">
          ${ids.filter(id=>State.students[id].status==='active' && id!==selectedId).map(id=>`
            <button class="btn btn-ghost px-3 py-1 text-xs" onclick="castVote('${selectedId}','${id}')">${State.students[id].name}</button>
          `).join('')}
        </div>
        ${State.meta.council.votes?.[selectedId] ? `<div class="text-xs mono mt-2" style="color:var(--cyber)">Oyunuz kaydedildi: ${State.students[State.meta.council.votes[selectedId]]?.name||'—'}</div>`:''}
      </div>`;
    }
  }

  const gameEndBanner = State.meta.gameEnded ? `
    <div class="card p-4 text-center" style="border-color:var(--gold)">
      <div class="text-sm font-semibold" style="color:var(--gold)">Oyun sona erdi: ${State.meta.winner==='ajan'?'Ajanlar':'Araştırmacılar'} kazandı.</div>
    </div>` : '';

  const ch = State.meta.currentHint;
  const hintBlock = (ch && s.status==='active' && s.hintDismissedAt !== ch.sentAt) ? `
    <div class="card p-4" style="border-color:var(--gold)">
      <div class="flex justify-between items-start gap-3">
        <div>
          <div class="text-xs mono mb-1" style="color:var(--gold)">💡 ÖĞRETMEN İPUCU</div>
          <p class="text-sm leading-relaxed">${ch.text}</p>
        </div>
        <button class="btn btn-ghost px-2 py-1 text-xs" onclick="dismissHint('${selectedId}')">✕ Kapat</button>
      </div>
    </div>` : '';

  return `
  ${navBar('ogrenci')}
  <div class="max-w-2xl mx-auto px-4 py-8 space-y-6">
    <div class="flex items-center justify-between">
      <div>
        <div class="text-xs mono text-[var(--ink-dim)]">DOSYA SAHİBİ</div>
        <div class="text-xl font-semibold">${s.name}</div>
      </div>
      <button class="btn btn-ghost px-3 py-1 text-xs" onclick="State.selectedStudent=null; render();">Çıkış</button>
    </div>

    ${gameEndBanner}
    ${hintBlock}
    ${sabotageNotice}
    ${councilNotice}
    ${envelopeBlock}
    ${sabotageMoveBlock}
    ${microtestBlock}

    <div class="card p-4">
      <div class="text-xs mono text-[var(--ink-dim)] mb-2">PUAN DÖKÜMÜM</div>
      <div class="grid grid-cols-2 gap-3 text-sm">
        <div>Ödev: <b class="mono">${breakdown.hw}</b></div>
        <div>Mikro Test: <b class="mono">${breakdown.micro}</b></div>
        <div>Gizli Görev: <b class="mono">${breakdown.secret}</b></div>
        <div>🎫 Bilet: <b class="mono">${tickets}</b></div>
      </div>
      <div class="text-right mt-3 text-2xl font-semibold mono" style="color:var(--gold)">${breakdown.total}</div>
      ${!weekRevealed ? `<div class="text-xs mt-2" style="color:var(--ink-dim)">🔒 Bu haftanın puanı sabotaj süreci sonuçlanınca eklenecek.</div>`:''}
    </div>

    <div class="card p-4">
      <div class="flex items-center justify-between">
        <div class="text-sm">Durum</div>
        <span class="tag ${isShadow?'tag-shadow':'tag-active'}">${isShadow?'GÖLGE MODU':'AKTİF'}</span>
      </div>
      ${(isShadow && s.role==='arastirmaci') ? `
      <div class="mt-3">
        <div class="text-xs mono text-[var(--ink-dim)] mb-1">DİRİLİŞ İLERLEMESİ (elendikten sonra 2 hafta üst üste tam puan)</div>
        <div class="progress-track h-2"><div class="progress-fill h-full" style="width:${resurrectionPct}%"></div></div>
      </div>`:''}
    </div>

    <div class="card p-4">
      <div class="text-sm font-medium mb-2">Bu Haftaki Karnem (Hafta ${State.meta.currentWeek})</div>
      ${weekRevealed ? `
      <div class="grid grid-cols-2 gap-2 text-sm mono">
        <div>Ödev: ${w.homework ? w.homework.toUpperCase() : '—'}</div>
        <div>Gizli Görev: ${w.secretTask ? '✓' : '—'}</div>
        <div>Soru 1: ${w.q1===true?'✓':(w.q1===false?'✗':'—')}</div>
        <div>Soru 2: ${w.q2===true?'✓':(w.q2===false?'✗':'—')}</div>
      </div>
      <div class="text-right mt-2 font-semibold" style="color:var(--cyber)">Bu hafta: ${computeWeeklyTotal(w)}</div>
      ` : `
      <div class="text-sm flex items-center gap-2" style="color:var(--ink-dim)">🔒 Bu haftanın puanı, sabotaj süreci tamamlanana kadar gizli tutuluyor.</div>
      `}
    </div>

    <div class="card p-4">
      <div class="text-xs mono text-[var(--ink-dim)] mb-1">SINIF İPUCU FONU</div>
      <div class="thermo-track h-3"><div class="thermo-fill h-full" style="width:${Math.min(100,(visibleClassTotal()/State.meta.hintThreshold)*100)}%"></div></div>
      <div class="text-xs mono mt-1 text-right">${visibleClassTotal().toFixed(1)} / ${State.meta.hintThreshold}</div>
    </div>

    ${councilBlock}
    ${councilHistoryHtml()}
    <div class="flex justify-center">${installButtonHtml()}</div>
  </div>
  ${appFooterHtml()}`;
}

function councilHistoryHtml(){
  const log = State.meta.councilLog || {};
  const weeks = Object.keys(log).sort((a,b)=>Number(b)-Number(a));
  if(!weeks.length) return '';
  return `
  <div class="card p-4">
    <div class="font-medium mb-2">🗂️ Konsey Geçmişi</div>
    <div class="space-y-3 text-sm">
      ${weeks.map(wk=>{
        const entry = log[wk];
        return `
        <div class="border-b border-white/10 pb-2">
          <div class="mono text-xs text-[var(--ink-dim)]">Hafta ${wk} — ${entry.eliminatedNames?.length ? entry.eliminatedNames.join(', ')+' elendi' : 'kimse elenmedi'}</div>
          <div class="mt-1 space-y-0.5">
            ${(entry.votes||[]).map(v=>`<div class="text-xs mono">${v.voterName} → ${v.targetName}</div>`).join('') || '<div class="text-xs text-[var(--ink-dim)]">Oy kaydı yok</div>'}
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function studentLogin(){
  const id = document.getElementById('studentPick').value;
  const pw = document.getElementById('studentPw').value;
  const err = document.getElementById('studentLoginError');
  if(!id){ err.textContent = 'Lütfen adınızı seçin.'; return; }
  if(!checkStudentPassword(id, pw)){ err.textContent = 'Şifre hatalı.'; return; }
  State.selectedStudent = id;
  State.envelopeOpen = false;
  render();
}
function dismissSabotageNotice(id){ saveStudent(id, {pendingSabotageNotice:false}); }
function dismissCouncilNotice(id){ saveStudent(id, {pendingCouncilNotice:false}); }
function dismissHint(id){
  const ch = State.meta.currentHint;
  if(!ch) return;
  saveStudent(id, { hintDismissedAt: ch.sentAt });
}
function confirmSabotageMove(){
  const sel = document.getElementById('sabTargetSelect');
  if(!sel || !sel.value) return;
  const moves = Object.assign({}, State.meta.sabotage.moves||{});
  moves[State.selectedStudent] = { targetId: sel.value, committed:true };
  saveMeta({ sabotage: Object.assign({}, State.meta.sabotage, {moves}) });
}
function undoSabotageMove(){
  const moves = Object.assign({}, State.meta.sabotage.moves||{});
  delete moves[State.selectedStudent];
  saveMeta({ sabotage: Object.assign({}, State.meta.sabotage, {moves}) });
}
function submitMicrotestAnswer(qKey, letter){
  const mt = State.meta.microtest;
  if(!mt || mt.mode!=='digital') return;
  const myAssignment = mt.assignments?.[State.selectedStudent] || {};
  const qId = qKey==='q1' ? myAssignment.q1Id : myAssignment.q2Id;
  const q = (State.meta.questionBank||[]).find(x=>x.id===qId);
  let val = null;
  if(letter !== null && q){ val = (letter === q.correct); }
  saveWeekly(State.selectedStudent, String(State.meta.currentWeek), { [qKey]: val });
  const responded = Object.assign({}, State.meta.microtest.responded||{});
  responded[State.selectedStudent] = Object.assign({}, responded[State.selectedStudent], { [qKey]: true });
  saveMeta({ microtest: Object.assign({}, State.meta.microtest, { responded }) });
}
function castVote(voterId, targetId){
  if(State.students[voterId]?.status!=='active') return;
  const votes = Object.assign({}, State.meta.council?.votes||{});
  votes[voterId] = targetId;
  saveMeta({ council: Object.assign({}, State.meta.council, {active:true, votes}) });
}
</script>

function viewTahtaSetupNeeded(){

  ${navBar('tahta')}
  <div class="max-w-sm mx-auto px-6 py-20 text-center">

    <p class="text-sm text-[var(--ink-dim)]">Akıllı tahta ekranı için öğretmen henüz bir şifre belirlemedi.</p>
  </div>
  ${appFooterHtml()}`;
}
function viewTahtaGiris(){
  return `
  ${navBar('tahta')}
  <div class="max-w-sm mx-auto px-6 py-20">
    <div class="text-xs mono text-[var(--ink-dim)] mb-2">SINIRLI ERİŞİM</div>
    <h2 class="text-2xl font-semibold mb-4">Akıllı Tahta Girişi</h2>
    <input id="boardPw" type="password" placeholder="Şifre" class="w-full px-3 py-2 mb-3" onkeydown="if(event.key==='Enter') boardLogin();">
    <div id="boardLoginError" class="text-xs mb-2" style="color:var(--danger)"></div>
    <button class="btn btn-gold w-full py-2" onclick="boardLogin()">Giriş Yap</button>
  </div>
  ${appFooterHtml()}`;
}
function boardLogin(){
  const pw = document.getElementById('boardPw').value;
  const err = document.getElementById('boardLoginError');
  if(checkBoardPassword(pw)){ setBoardAuthed(true); render(); }
  else { err.textContent = 'Şifre hatalı.'; }
}
function boardLogout(){ setBoardAuthed(false); render(); }

function viewTahta(){
  const ids = Object.keys(State.students);
  const sorted = [...ids].sort((a,b)=>visibleTotalScore(State.students[b])-visibleTotalScore(State.students[a]));
  const pct = Math.min(100,(visibleClassTotal()/State.meta.hintThreshold)*100);
  const weekRevealed = isCurrentWeekRevealed();

  const voteCounts = {};
  Object.values(State.meta.council?.votes||{}).forEach(t=>{ voteCounts[t]=(voteCounts[t]||0)+1; });
  const maxVotes = Math.max(1,...Object.values(voteCounts));

  return `
  ${navBar('tahta')}
  <div class="max-w-6xl mx-auto px-6 py-8 space-y-8">

    <div class="flex justify-end">
      <button class="btn btn-ghost px-3 py-1 text-xs" onclick="boardLogout()">🔒 Kilitle</button>
    </div>

    ${State.meta.gameEnded ? `
    <div class="card p-6 text-center border-2" style="border-color:var(--gold)">
      <div class="text-xs mono text-[var(--ink-dim)]">OYUN SONA ERDİ</div>
      <div class="text-3xl font-semibold mt-2" style="color:var(--gold)">${State.meta.winner==='ajan'?'🕶️ AJANLAR KAZANDI':'🔬 ARAŞTIRMACILAR KAZANDI'}</div>
      <div class="text-sm text-[var(--ink-dim)] mt-1">${State.meta.winReason||''}</div>
    </div>`:''}

    <div class="text-center">
      <div class="text-xs mono tracking-widest" style="color:var(--cyber)">CANLI YAYIN — HAFTA ${State.meta.currentWeek}</div>
      <h1 class="text-3xl font-semibold glow-title">Sınıf İpucu Termometresi</h1>
      <div class="thermo-track h-6 mt-4 max-w-2xl mx-auto"><div class="thermo-fill h-full flex items-center justify-end pr-2 text-xs font-bold" style="width:${pct}%">${pct>15?Math.round(pct)+'%':''}</div></div>
      <div class="mono text-sm mt-2 text-[var(--ink-dim)]">${visibleClassTotal().toFixed(1)} / ${State.meta.hintThreshold} puan</div>
      ${State.meta.currentHint ? `<div class="mt-3 card p-3 max-w-xl mx-auto text-left" style="border-color:var(--gold)"><div class="text-xs mono mb-1" style="color:var(--gold)">🔓 İPUCU YAYINLANDI</div><div class="text-sm">${State.meta.currentHint.text}</div></div>`:''}
      ${!weekRevealed ? `<div class="mt-2 text-xs mono" style="color:var(--ink-dim)">🔒 Bu haftanın puanları sabotaj süreci sonuçlanınca görünecek</div>`:''}
    </div>

    <div class="card p-5">
      <div class="font-medium mb-3">Canlı Skorboard — Detaylı</div>
      <div class="space-y-2">
        ${sorted.map((id,i)=>{
          const s = State.students[id];
          const b = visibleTotalBreakdown(s);
          return `
          <div class="px-3 py-2 rounded ${s.status==='shadow'?'opacity-50':''}" style="background:rgba(255,255,255,0.03)">
            <div class="flex items-center justify-between flex-wrap gap-2">
              <div class="flex items-center gap-2">
                <span class="mono text-xs text-[var(--ink-dim)]">#${i+1}</span>
                <span>${s.name}</span>
                ${s.status==='shadow'?`<span class="tag tag-shadow">GÖLGE</span>`:''}
              </div>
              <div class="flex items-center gap-3">
                <span class="mono text-xs" style="color:var(--cyber)">🎫${visibleTicketsFor(s)}</span>
                <span class="mono font-semibold" style="color:var(--gold)">${b.total}</span>
              </div>
            </div>
            <div class="flex gap-4 mt-1 text-xs mono text-[var(--ink-dim)]">
              <span>Ödev: ${b.hw}</span><span>Mikro Test: ${b.micro}</span><span>Gizli Görev: ${b.secret}</span>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>

    ${State.meta.council?.lastResult ? `
    <div class="card p-4 text-center">
      <div class="text-xs mono text-[var(--ink-dim)]">SON KONSEY SONUCU — HAFTA ${State.meta.council.lastResult.weekId}</div>
      <div class="text-lg font-semibold mt-1">${(State.meta.council.lastResult.eliminatedNames||[]).length ? (State.meta.council.lastResult.eliminatedNames||[]).join(' & ') + ' elendi' : 'Kimse elenmedi'}</div>
    </div>`:''}

    ${State.meta.council?.active ? `
    <div class="card p-5">
      <div class="font-medium mb-3">🗳️ Canlı Oy Sayımı</div>
      <div class="space-y-2 mb-4">
        ${Object.entries(voteCounts).map(([id,count])=>`
          <div>
            <div class="flex justify-between text-sm mb-1"><span>${State.students[id]?.name||'?'}</span><span class="mono">${count}</span></div>
            <div class="progress-track h-3"><div class="progress-fill h-full" style="width:${(count/maxVotes)*100}%"></div></div>
          </div>`).join('') || `<div class="text-sm text-[var(--ink-dim)]">Henüz oy yok</div>`}
      </div>
      <div class="text-xs mono text-[var(--ink-dim)] mb-1">OY DÖKÜMÜ</div>
      <div class="space-y-1 text-sm">
        ${Object.entries(State.meta.council.votes||{}).map(([voterId,targetId])=>`<div>${State.students[voterId]?.name||'?'} → ${State.students[targetId]?.name||'?'}</div>`).join('') || `<div class="text-[var(--ink-dim)]">Henüz oy yok</div>`}
      </div>
    </div>`:''}

    ${lotteryStageHtml()}
  </div>
  ${appFooterHtml()}`;
}

function fireConfettiBurst(count){
  count = count || 60;
  const colors = ['#D4AF37','#33FFB0','#E9EEF6'];
  for(let i=0;i<count;i++){
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = Math.random()*100+'vw';
    el.style.background = colors[i%colors.length];
    el.style.animationDuration = (2+Math.random()*2)+'s';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 4500);
  }
}
function maybeStartLotteryShow(){
  const lot = State.meta.lottery;
  if(!lot || !lot.ranAt || !lot.winners || !lot.winners.length) return;
  if(State.lastLotteryShown === lot.ranAt) return;
  State.lastLotteryShown = lot.ranAt;
  State.lotteryRevealed = [];
  render();
  fireConfettiBurst(30);
  lot.winners.forEach((name,i)=>{
    setTimeout(()=>{
      State.lotteryRevealed = [...(State.lotteryRevealed||[]), name];
      fireConfettiBurst(80);
      render();
    }, 1800 + i*2400);
  });
}
function lotteryStageHtml(){
  const lot = State.meta.lottery;
  if(!lot || !lot.winners || !lot.winners.length) return '';
  const revealed = State.lotteryRevealed || [];
  const done = revealed.length >= lot.winners.length;
  return `
  <div class="card p-8 text-center border-2" style="border-color:var(--gold)">
    <div class="text-sm mono text-[var(--ink-dim)]">DÖNEM SONU PİYANGOSU</div>
    ${!done ? `<div class="text-lg mt-3 mono" style="color:var(--cyber)">🎰 Kura çekiliyor...</div>` : ''}
    <div class="flex flex-col items-center gap-3 mt-4">
      ${revealed.map(name=>`<div class="letter-reveal text-2xl font-semibold" style="color:var(--gold)">🎉 ${name} 🎉</div>`).join('')}
    </div>
  </div>`;
}
</script>

<script>
function render(){
  try{
    const scrollY = window.scrollY;
    const scrollX = window.scrollX;
    const tableWrap = document.getElementById('teacherTableWrap');
    const tableScrollLeft = tableWrap ? tableWrap.scrollLeft : 0;

    const route = currentRoute();
    let html = '';
    if(route==='ogretmen') html = isTeacherAuthed() ? viewOgretmen() : viewOgretmenGiris();
    else if(route==='admin') html = (isTeacherAuthed() && isCurrentUserAdmin()) ? viewAdminPanel() : viewAdminGiris();
    else if(route==='ogrenci') html = viewOgrenci();
    else if(route==='tahta'){
      html = !hasBoardPassword() ? viewTahtaSetupNeeded() : (!isBoardAuthed() ? viewTahtaGiris() : viewTahta());
    }
    else html = viewGiris();

    document.getElementById('app').innerHTML = html;

    window.scrollTo(scrollX, scrollY);
    const newWrap = document.getElementById('teacherTableWrap');
    if(newWrap) newWrap.scrollLeft = tableScrollLeft;

    if(route==='tahta' && hasBoardPassword() && isBoardAuthed()) maybeStartLotteryShow();
  }catch(err){
    console.error('Render hatası:', err);
    document.getElementById('app').innerHTML = `
      <div style="max-width:640px;margin:60px auto;padding:20px;font-family:monospace;color:#E9EEF6;background:#152744;border:1px solid #E4536B;border-radius:4px;">
        <b style="color:#E4536B">Bir hata oluştu.</b>
        <div style="margin-top:8px;font-size:13px;white-space:pre-wrap;">${(err && err.message) || err}</div>
        <button onclick="location.hash='';location.reload()" style="margin-top:14px;padding:8px 14px;background:#D4AF37;color:#1a1204;border:none;border-radius:2px;cursor:pointer;">Başa Dön</button>
      </div>`;
  }
}

initSync();
render();
</script>

<!-- ================= PWA: MANIFEST + SERVICE WORKER + YUKLEME BUTONU (TEK DOSYA) ================= -->
<script>
const PWA_ICON_192 = "assets/site_logo.png";
const PWA_ICON_512 = "assets/site_logo.png";

// Dokunma/favicon ikonlarini tek dosya icinde (harici PNG dosyasi olmadan) ayarla
document.getElementById("appleTouchIconLink").href = PWA_ICON_192;
document.getElementById("faviconLink").href = PWA_ICON_192;

// Web App Manifest'i disaridan bir manifest.json dosyasi OLMADAN, tamamen JS icinden
// bir Blob olarak uretip sayfaya bagliyoruz -- boylece tek HTML dosyasi yeterli oluyor.
const pwaManifest = {
  name: "thegamifyclass.com",
  short_name: "thegamifyclass.com",
  start_url: "./",
  scope: "./",
  display: "standalone",
  theme_color: "#1B365D",
  background_color: "#0F172A",
  orientation: "portrait",
  lang: "tr",
  icons: [
    { src: PWA_ICON_192, sizes: "192x192", type: "image/png", purpose: "any maskable" },
    { src: PWA_ICON_512, sizes: "512x512", type: "image/png", purpose: "any maskable" }
  ]
};
const pwaManifestBlob = new Blob([JSON.stringify(pwaManifest)], { type: "application/manifest+json" });
document.getElementById("manifestLink").href = URL.createObjectURL(pwaManifestBlob);

// Service Worker kodu da harici bir .js dosyasi OLMADAN, JS icinden Blob olarak uretiliyor.
// NOT: Bazi tarayicilar guvenlik geregi Service Worker'in blob: adresinden kaydini
// engelleyebilir -- bu durumda uygulama normal calismaya devam eder, sadece ekstra
// offline onbellekleme devreye girmez. Tam offline garantisi icin ayri barindirilan
// bir service-worker.js dosyasi (opsiyonel) her zaman daha guvenilirdir.
const PWA_SW_SOURCE = "// Scientist vs Agent (AgentsMEV) — Service Worker\n// Sürüm numarasını uygulamayı her güncellediğinizde artırın (v1 -> v2 ...),\n// böylece eski önbellek otomatik silinip yenisiyle değiştirilir.\nconst CACHE_VERSION = 'v1';\nconst CACHE_NAME = `agentsmev-cache-${CACHE_VERSION}`;\n\nconst APP_SHELL = [\n  './',\n  './index.html',\n  './manifest.json',\n  './icon-192.png',\n  './icon-512.png'\n];\n\nself.addEventListener('install', (event) => {\n  event.waitUntil(\n    caches.open(CACHE_NAME)\n      .then((cache) => cache.addAll(APP_SHELL))\n      .catch((err) => console.warn('Önbelleğe alma sırasında hata:', err))\n  );\n  self.skipWaiting();\n});\n\nself.addEventListener('activate', (event) => {\n  event.waitUntil(\n    caches.keys().then((keys) =>\n      Promise.all(\n        keys\n          .filter((key) => key !== CACHE_NAME)\n          .map((key) => caches.delete(key))\n      )\n    )\n  );\n  self.clients.claim();\n});\n\n// Cache-first (hızlı/offline), arka planda ağdan güncelleyip önbelleği tazeler.\nself.addEventListener('fetch', (event) => {\n  if (event.request.method !== 'GET') return;\n\n  event.respondWith(\n    caches.match(event.request).then((cachedResponse) => {\n      const networkFetch = fetch(event.request)\n        .then((networkResponse) => {\n          if (networkResponse && networkResponse.status === 200) {\n            const responseClone = networkResponse.clone();\n            caches.open(CACHE_NAME).then((cache) => cache.put(event.request, responseClone));\n          }\n          return networkResponse;\n        })\n        .catch(() => cachedResponse);\n\n      return cachedResponse || networkFetch;\n    })\n  );\n});\n";

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    try{
      const swBlob = new Blob([PWA_SW_SOURCE], { type: "text/javascript" });
      const swUrl = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swUrl).catch(function(err){
        console.warn("Service worker (tek dosya modu) kaydedilemedi -- tarayici blob: adresini reddetmis olabilir. Uygulama yine calisir, sadece offline onbellek aktif olmaz.", err);
      });
    }catch(err){
      console.warn("Service worker olusturulamadi:", err);
    }
  });
}

let deferredInstallPrompt = null;
function isRunningStandalone(){
  return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
}
function refreshInstallButtons(){
  const btns = document.querySelectorAll("#pwaInstallBtn");
  btns.forEach(function(btn){
    btn.style.display = (deferredInstallPrompt && !isRunningStandalone()) ? "inline-flex" : "none";
  });
}
window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault();
  deferredInstallPrompt = e;
  refreshInstallButtons();
});
window.addEventListener("appinstalled", function(){
  deferredInstallPrompt = null;
  refreshInstallButtons();
});
function triggerPwaInstall(){
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.finally(function(){
    deferredInstallPrompt = null;
    refreshInstallButtons();
  });
}
// Her render sonrasi buton gorunurlugunu guncel tut
const _origRenderForPwa = render;

render = function(){
  _origRenderForPwa();
  refreshInstallButtons();
};
</script>
</body>
</html>
