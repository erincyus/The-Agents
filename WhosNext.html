<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Who's Next? | TheGamifyClass.com</title>
<meta name="description" content="Who's Next? — Kartlar arasında dönen çerçeve sıradaki öğrenciyi seçer. TheGamifyClass.com eğitimde oyunlaştırma.">
<meta name="theme-color" content="#060818">
<link rel="icon" id="favicon" type="image/webp" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
:root{
  --ink0:#060818;
  --ink1:#0b1030;
  --ink2:#121849;
  --ink3:#1c2463;
  --line:rgba(255,255,255,.13);
  --text:#eef1ff;
  --muted:#9aa5d8;
  --red:#ff3b57;
  --red2:#a8102b;
  --blue:#3aa8ff;
  --cyan:#5ce7ff;
  --violet:#a855f7;
  --green:#22c55e;
  --amber:#ffb020;
  --font-display:'Bungee','Impact','Arial Black',sans-serif;
  --font-body:'Chakra Petch','Segoe UI',system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:var(--font-body);
  color:var(--text);
  background:
    radial-gradient(900px 520px at 8% -8%, rgba(255,59,87,.20), transparent 62%),
    radial-gradient(900px 560px at 100% 105%, rgba(58,168,255,.20), transparent 62%),
    linear-gradient(180deg,var(--ink1),var(--ink0));
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  line-height:1.45;
  padding-top:var(--safe-t);
  padding-bottom:var(--safe-b);
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse at 50% 40%,#000 30%,transparent 78%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 30%,transparent 78%);
}
#app{position:relative;z-index:1;min-height:100%}
img{max-width:100%;display:block}
button{font-family:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px;border-radius:6px}
[hidden]{display:none!important}

/* ---------- Düğmeler ---------- */
.btn{
  --b1:#2a3380;--b2:#1a2160;--edge:#0d1240;
  appearance:none;border:0;cursor:pointer;
  font:700 1rem var(--font-body);color:#fff;letter-spacing:.2px;
  padding:.78rem 1.25rem;border-radius:14px;
  background:linear-gradient(180deg,var(--b1),var(--b2));
  box-shadow:0 5px 0 var(--edge),0 10px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.28);
  transition:transform .08s ease,box-shadow .08s ease,filter .15s;
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  text-decoration:none;
}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge),0 3px 8px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.2)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:saturate(.4)}
.btn.red{--b1:#ff4a63;--b2:#c81433;--edge:#7d0a20}
.btn.blue{--b1:#3aa8ff;--b2:#1f63d6;--edge:#123c8c}
.btn.green{--b1:#34d17a;--b2:#15954a;--edge:#0a5a2b}
.btn.amber{--b1:#ffc23d;--b2:#e58a00;--edge:#8a4f00;color:#2a1600}
.btn.gray{--b1:#6b7396;--b2:#454c70;--edge:#262b47}
.btn.ghost{
  --b1:transparent;--b2:transparent;--edge:transparent;
  background:transparent;box-shadow:none;border:1.5px solid var(--line);
}
.btn.ghost:hover{background:rgba(255,255,255,.07)}
.btn.ghost:active{transform:none}
.btn.sm{font-size:.86rem;padding:.5rem .85rem;border-radius:11px;box-shadow:0 3px 0 var(--edge),0 6px 12px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.sm.ghost{box-shadow:none}
.btn.lg{font-size:1.12rem;padding:1rem 1.6rem;border-radius:16px}
.linklike{background:none;border:0;color:var(--muted);cursor:pointer;font:500 .9rem var(--font-body);text-decoration:underline;text-underline-offset:3px;padding:.4rem}
.linklike:hover{color:var(--text)}

/* ---------- Form ---------- */
label.f{display:block;font-weight:600;font-size:.9rem;margin:0 0 .35rem;color:#cfd6ff}
.inp,.txa{
  width:100%;font:500 1rem var(--font-body);color:var(--text);
  background:rgba(4,6,26,.72);border:1.5px solid var(--line);border-radius:12px;
  padding:.72rem .9rem;
}
.txa{min-height:110px;resize:vertical}
.inp::placeholder,.txa::placeholder{color:#6b75ad}
.inp:focus,.txa:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(92,231,255,.22)}
.hint{font-size:.83rem;color:var(--muted);margin:.35rem 0 0}
.err{color:#ff8a9b;font-weight:600;font-size:.92rem;min-height:1.3em;margin:.5rem 0 0}
.row{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.grow{flex:1 1 220px}

/* ---------- Panel / Kart ---------- */
.panel{
  background:linear-gradient(180deg,rgba(24,31,90,.78),rgba(12,16,52,.82));
  border:1.5px solid var(--line);border-radius:20px;padding:1.4rem;
  box-shadow:0 18px 40px rgba(0,0,0,.35);
}
.panel h2,.panel h3{margin:0 0 .8rem;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:.4rem;padding:.28rem .7rem;border-radius:999px;background:rgba(255,255,255,.09);border:1px solid var(--line);font-weight:600;font-size:.85rem}
.chip.code{font-family:var(--font-display);letter-spacing:.14em;font-size:1rem;background:rgba(92,231,255,.12);border-color:rgba(92,231,255,.45);color:#c9f6ff;padding:.3rem .8rem}
.chip.warn{background:rgba(255,176,32,.14);border-color:rgba(255,176,32,.5);color:#ffd894}
.chip.ok{background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.5);color:#a6f0c3}

/* ---------- Açılış ---------- */
.home{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1.6rem;padding:1.5rem 1.2rem 2.2rem;text-align:center;
}
.back-site{position:absolute;top:calc(14px + var(--safe-t));left:18px;color:var(--muted);text-decoration:none;font-weight:600;font-size:.9rem}
.back-site:hover{color:var(--text)}
.hero-logo{width:min(560px,86vw,56vh);height:auto;margin:0 auto;filter:drop-shadow(0 18px 40px rgba(0,0,0,.5))}
.entry{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem;width:min(720px,100%)}
.entry-btn{
  appearance:none;border:0;cursor:pointer;text-align:left;color:#fff;
  padding:1.15rem 1.3rem 1.25rem;border-radius:18px;display:flex;flex-direction:column;gap:.3rem;
  transition:transform .08s,box-shadow .08s,filter .15s;
}
.entry-btn .t{font:400 1.3rem var(--font-display);letter-spacing:.02em}
.entry-btn .d{font-size:.92rem;font-weight:500;opacity:.9}
.entry-btn.teacher{background:linear-gradient(160deg,#ff4a63,#b5122e);box-shadow:0 7px 0 #6e0a1d,0 16px 26px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.35)}
.entry-btn.board{background:linear-gradient(160deg,#3aa8ff,#1c56c9);box-shadow:0 7px 0 #0f3382,0 16px 26px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.35)}
.entry-btn:hover{filter:brightness(1.08)}
.entry-btn:active{transform:translateY(5px);box-shadow:0 2px 0 #0009,0 6px 12px rgba(0,0,0,.4)}

/* ---------- Giriş formu ---------- */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem 1rem}
.auth-card{width:min(460px,100%);text-align:left}
.auth-logo{width:170px;margin:0 auto 1rem}
.auth-card h2{font:400 1.45rem var(--font-display);text-align:center;margin:0 0 .3rem}
.auth-card .sub{color:var(--muted);text-align:center;margin:0 0 1.1rem;font-size:.95rem}
.auth-card .field{margin-bottom:.9rem}

/* ---------- Üst çubuk (panel) ---------- */
.topbar{
  display:flex;align-items:center;gap:1rem;flex-wrap:wrap;
  padding:.8rem 1.4rem;border-bottom:1.5px solid var(--line);
  background:rgba(6,8,24,.7);backdrop-filter:blur(10px);position:sticky;top:0;z-index:20;
}
.topbar .brand{display:flex;align-items:center;gap:.7rem;text-decoration:none}
.topbar .brand img{width:46px;height:46px;object-fit:contain}
.topbar .brand b{font:400 1.15rem var(--font-display);letter-spacing:.03em}
.topbar .sp{flex:1}
.page{max-width:1120px;margin:0 auto;padding:1.6rem 1.2rem 3.5rem}
.page h1{font:400 1.7rem var(--font-display);margin:0 0 .3rem}
.page .lead{color:var(--muted);margin:0 0 1.4rem}

.class-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:1.1rem}
.class-card{display:flex;flex-direction:column;gap:.75rem}
.class-card h3{font:700 1.25rem var(--font-body);margin:0}
.class-card .meta{display:flex;gap:.5rem;flex-wrap:wrap}
.class-card .acts{display:flex;gap:.55rem;flex-wrap:wrap;margin-top:.2rem}
.class-new{
  border:2px dashed rgba(255,255,255,.28);border-radius:20px;background:transparent;color:var(--text);
  min-height:190px;cursor:pointer;font:700 1.05rem var(--font-body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;
  transition:background .15s,border-color .15s;
}
.class-new:hover:not([disabled]){background:rgba(255,255,255,.06);border-color:var(--cyan)}
.class-new[disabled]{opacity:.55;cursor:not-allowed}
.class-new .plus{font:400 2.4rem var(--font-display);line-height:1;color:var(--cyan)}

.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin:1.2rem 0 1.1rem;border-bottom:1.5px solid var(--line)}
.tab{
  appearance:none;background:none;border:0;color:var(--muted);cursor:pointer;
  font:700 1rem var(--font-body);padding:.7rem 1.1rem;border-bottom:3px solid transparent;margin-bottom:-1.5px;
}
.tab:hover{color:var(--text)}
.tab.on{color:#fff;border-bottom-color:var(--red)}

.stack{display:flex;flex-direction:column;gap:1.1rem}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.1rem}
.slist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.5rem}
.sitem{display:flex;align-items:center;gap:.5rem;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:11px;padding:.4rem .5rem .4rem .75rem;font-weight:600}
.sitem .n{color:var(--muted);font-weight:500;font-size:.8rem;min-width:1.7em}
.sitem .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xbtn{appearance:none;border:0;background:rgba(255,59,87,.16);color:#ff9aa9;border-radius:8px;width:28px;height:28px;cursor:pointer;font-weight:700}
.xbtn:hover{background:rgba(255,59,87,.35);color:#fff}
.empty{color:var(--muted);text-align:center;padding:1.4rem .6rem;border:1.5px dashed var(--line);border-radius:14px}

.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem;margin-bottom:1rem}
.seg button{
  appearance:none;cursor:pointer;text-align:left;color:var(--text);
  background:rgba(255,255,255,.05);border:1.5px solid var(--line);border-radius:14px;padding:.8rem 1rem;font:700 1rem var(--font-body);
}
.seg button small{display:block;font-weight:500;color:var(--muted);margin-top:.15rem;font-size:.82rem}
.seg button.on{border-color:var(--cyan);background:rgba(92,231,255,.11)}
.opts{display:flex;gap:.5rem;flex-wrap:wrap}
.opt{
  appearance:none;cursor:pointer;width:52px;height:52px;border-radius:13px;font:400 1.25rem var(--font-display);color:#fff;
  background:rgba(255,255,255,.07);border:1.5px solid var(--line);
}
.opt:hover{background:rgba(255,255,255,.14)}
.opt.on{background:linear-gradient(160deg,#34d17a,#15954a);border-color:#9cf0c2;box-shadow:0 0 18px rgba(52,209,122,.5)}
.drop{
  border:2px dashed rgba(255,255,255,.3);border-radius:16px;padding:1.1rem;text-align:center;cursor:pointer;color:var(--muted);
}
.drop:hover,.drop.over{border-color:var(--cyan);color:var(--text);background:rgba(92,231,255,.06)}
.drop img{max-height:220px;margin:0 auto .5rem;border-radius:10px;background:#fff}
.qitem{display:grid;grid-template-columns:auto 1fr auto;gap:.9rem;align-items:center;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:.7rem .8rem}
.qitem .th{width:74px;height:56px;border-radius:9px;background:#fff;object-fit:contain}
.qitem .ph{width:74px;height:56px;border-radius:9px;background:rgba(92,231,255,.12);display:grid;place-items:center;font:400 1.3rem var(--font-display);color:var(--cyan)}
.qitem .qt{font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qitem .qa{font-size:.85rem;color:var(--muted)}
.switch{display:flex;gap:1rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tgl{position:relative;width:60px;height:34px;flex:none}
.tgl input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0;width:100%;height:100%;z-index:2}
.tgl i{position:absolute;inset:0;border-radius:99px;background:#39406e;border:1.5px solid var(--line);transition:background .2s}
.tgl i::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 5px rgba(0,0,0,.4)}
.tgl input:checked + i{background:var(--green)}
.tgl input:checked + i::after{transform:translateX(26px)}
.tgl input:focus-visible + i{outline:3px solid var(--cyan);outline-offset:3px}
table.tb{width:100%;border-collapse:collapse;font-size:.94rem}
table.tb th{text-align:left;color:var(--muted);font-weight:600;padding:.55rem .6rem;border-bottom:1.5px solid var(--line)}
table.tb td{padding:.65rem .6rem;border-bottom:1px solid rgba(255,255,255,.07);vertical-align:middle}
table.tb tr.off td{opacity:.55}
.tbwrap{overflow-x:auto}
.danger{border-color:rgba(255,59,87,.45)}

/* ---------- Diyalog / bildirim ---------- */
.ov{position:fixed;inset:0;z-index:200;background:rgba(3,4,16,.72);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:1rem;animation:fadein .15s}
.dlg{width:min(480px,100%);max-height:92vh;overflow:auto;background:linear-gradient(180deg,#1a2158,#0e1340);border:1.5px solid var(--line);border-radius:20px;padding:1.4rem;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.dlg.wide{width:min(640px,100%)}
.dlg h3{margin:0 0 .7rem;font:400 1.25rem var(--font-display)}
.dlg-body{color:#dfe4ff}
.dlg-body p{margin:.3rem 0 .8rem}
.dlg-actions{display:flex;gap:.6rem;justify-content:flex-end;flex-wrap:wrap;margin-top:1.1rem}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%);z-index:300;background:#141a4d;border:1.5px solid var(--line);color:#fff;padding:.75rem 1.2rem;border-radius:14px;font-weight:600;box-shadow:0 14px 30px rgba(0,0,0,.5);animation:toastin .25s;max-width:min(560px,92vw);text-align:center}
.toast.ok{border-color:rgba(52,209,122,.7)}
.toast.err{border-color:rgba(255,59,87,.8);background:#3a0f22}
.splash{min-height:100vh;display:grid;place-items:center}
.spin{width:44px;height:44px;border-radius:50%;border:5px solid rgba(255,255,255,.15);border-top-color:var(--red);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

/* =====================================================================
   OYUN EKRANI
   ===================================================================== */
.game{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;padding-top:var(--safe-t);padding-bottom:var(--safe-b);
  background:
    radial-gradient(1000px 600px at 50% -20%, rgba(168,85,247,.18), transparent 60%),
    radial-gradient(800px 500px at 0% 110%, rgba(255,59,87,.15), transparent 60%),
    linear-gradient(180deg,#0a0e2e,#050716);
}
.gbar{
  flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1rem;
  padding:.65rem 1.1rem;border-bottom:1.5px solid var(--line);background:rgba(4,6,22,.7);
}
.gbar .l{display:flex;align-items:center;gap:.8rem;min-width:0}
.gbar .l img{width:44px;height:44px;object-fit:contain;flex:none}
.gbar .cn{font-weight:700;font-size:1.05rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gbar .r{display:flex;align-items:center;gap:.6rem;justify-content:flex-end}
.play{
  font:400 clamp(1.15rem,2.2vw,1.9rem) var(--font-display);letter-spacing:.06em;
  padding:.7rem clamp(1.6rem,4vw,3.4rem);border-radius:18px;border:0;cursor:pointer;color:#fff;
  background:linear-gradient(180deg,#b26bff,#7a2fe0);
  box-shadow:0 7px 0 #421286,0 14px 28px rgba(122,47,224,.45),inset 0 2px 0 rgba(255,255,255,.4);
  transition:transform .08s,box-shadow .08s,filter .15s;
}
.play:hover:not([disabled]){filter:brightness(1.1)}
.play:active:not([disabled]){transform:translateY(5px);box-shadow:0 2px 0 #421286,0 6px 12px rgba(122,47,224,.4)}
.play[disabled]{background:linear-gradient(180deg,#5b5f80,#3c405e);box-shadow:0 7px 0 #22253c;cursor:not-allowed;color:#c5c9e6}
.stat{font-weight:700;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:12px;padding:.4rem .8rem;white-space:nowrap}
.stat b{font-family:var(--font-display);font-weight:400;color:var(--cyan)}
.ibtn{appearance:none;cursor:pointer;width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.08);border:1.5px solid var(--line);color:#fff;font-size:1.1rem;display:grid;place-items:center}
.ibtn:hover{background:rgba(255,255,255,.16)}
.gwrap{flex:1;min-height:0;display:flex;position:relative}
.gcol{flex:1;min-width:0;position:relative}
.gmain{position:absolute;inset:0;padding:1.1rem 1.3rem .3rem;overflow:hidden}
.lb{width:280px;flex:none;border-left:1.5px solid var(--line);background:rgba(4,6,22,.62);padding:1rem .9rem;overflow:auto}
.lb h3{font:400 1.05rem var(--font-display);margin:0 0 .8rem;letter-spacing:.02em}
.lbl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.45rem}
.lbr{display:flex;align-items:center;gap:.6rem;padding:.45rem .6rem;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.lbr.r1{background:linear-gradient(90deg,rgba(255,200,40,.24),rgba(255,255,255,.05));border-color:rgba(255,200,40,.55)}
.lbr.r2{background:linear-gradient(90deg,rgba(190,200,230,.2),rgba(255,255,255,.05));border-color:rgba(200,208,235,.5)}
.lbr.r3{background:linear-gradient(90deg,rgba(210,125,50,.24),rgba(255,255,255,.05));border-color:rgba(210,125,50,.55)}
.lbr .rk{width:30px;flex:none;text-align:center;font-weight:700;color:var(--muted)}
.lbr .md{width:26px;height:30px;display:block;margin:0 auto}
.lbr .ln{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbr .ls{font-size:.82rem;color:var(--muted);white-space:nowrap}
.lbr .ls b{color:var(--cyan);font-size:1rem}
.lbr.out{opacity:.5}
.lbr.out .ln{text-decoration:line-through}
@media (max-width:999px){.lb{position:absolute;right:0;top:0;bottom:0;z-index:30;background:rgba(4,6,22,.96)}}
.grid{display:grid;justify-content:center;align-content:center;min-height:100%;gap:var(--gap,12px);grid-template-columns:repeat(var(--cols,5),var(--cw,200px));grid-auto-rows:var(--ch,130px)}

/* Öğrenci kartı */
.card{position:relative;width:var(--cw);height:var(--ch);perspective:900px;
  --c1:#ffb03a;--c2:#ff7a1a;--edge:#a84a00;--ink:#2a1200;--rb:#2f6bff;--rbt:#fff;
  font-size:calc(var(--cw)*.1);
}
.card-body{
  position:absolute;inset:0;border-radius:calc(var(--cw)*.075);overflow:hidden;
  background:linear-gradient(155deg,var(--c1),var(--c2));
  box-shadow:
    0 calc(var(--cw)*.03) 0 var(--edge),
    0 calc(var(--cw)*.065) calc(var(--cw)*.09) rgba(0,0,0,.55),
    inset 0 2px 0 rgba(255,255,255,.6),
    inset 0 -4px 0 rgba(0,0,0,.14);
  transition:filter .5s;
}
.card-body::before{ /* seçilince yeşile dönen katman */
  content:"";position:absolute;inset:0;border-radius:inherit;z-index:1;
  background:linear-gradient(155deg,#7cf5ad,#1faa55 70%,#128441);
  opacity:0;transition:opacity .45s;
}
.card-body::after{ /* parlama */
  content:"";position:absolute;inset:0;border-radius:inherit;z-index:4;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.34) 0 22%,transparent 22.5% 100%);
}
.card .slot{position:absolute;z-index:3;top:6%;left:50%;width:24%;height:5.4%;transform:translateX(-50%);border-radius:99px;background:rgba(6,8,24,.58);box-shadow:inset 0 2px 3px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.45)}
.card .ix{position:absolute;z-index:3;right:6.5%;top:4.6%;font-weight:700;font-size:.55em;color:var(--ink);opacity:.5}
.card .nm{
  position:absolute;z-index:3;left:6%;right:6%;top:15%;height:72%;
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-weight:700;color:var(--ink);line-height:1.06;overflow-wrap:anywhere;
  text-shadow:0 1px 0 rgba(255,255,255,.4);font-size:var(--fs,20px);
  transition:color .4s,height .3s,top .3s;
}
.card.has-rb .nm{height:41%}
.card .rb{
  position:absolute;z-index:5;left:0;right:0;bottom:7%;height:35%;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:0 5%;
  font-family:var(--font-display);color:var(--rbt);background:var(--rb);text-wrap:balance;
  font-size:var(--rfs,14px);line-height:1.05;letter-spacing:.02em;
  box-shadow:0 -3px 0 rgba(255,255,255,.35),0 4px 10px rgba(0,0,0,.35);
  transform:translateY(130%);opacity:0;transition:transform .35s cubic-bezier(.2,1.3,.4,1),opacity .2s;
}
.card.has-rb .rb{transform:none;opacity:1}
.card .tk{position:absolute;z-index:6;left:5%;top:3.2%;display:none;align-items:center;gap:.15em;font-weight:700;font-size:.62em;color:#3d2300}
.card .tk svg{width:2.4em;height:1.6em;filter:drop-shadow(0 1px 0 rgba(255,255,255,.5))}
.card.has-tk .tk{display:flex}
.card.has-tk.tk-pop .tk{animation:tkpop .8s cubic-bezier(.2,1.6,.4,1)}
@keyframes tkpop{0%{transform:scale(0) rotate(-40deg)}60%{transform:scale(1.9) rotate(8deg)}100%{transform:scale(1) rotate(0)}}

.card.scan{z-index:4}
.card.scan .card-body{
  transform:translateY(-3px) scale(1.045);
  box-shadow:
    0 0 0 calc(var(--cw)*.028) var(--violet),
    0 0 0 calc(var(--cw)*.05) rgba(168,85,247,.38),
    0 0 calc(var(--cw)*.16) calc(var(--cw)*.045) rgba(168,85,247,.8),
    0 calc(var(--cw)*.03) 0 var(--edge);
}
.card.picked{z-index:8;animation:pick 1s cubic-bezier(.25,1,.35,1) both}
.card.picked .card-body::before{opacity:1}
.card.picked .card-body{box-shadow:0 0 0 calc(var(--cw)*.022) #c8ffd9,0 0 calc(var(--cw)*.2) calc(var(--cw)*.05) rgba(52,211,110,.85),0 calc(var(--cw)*.03) 0 #0c6b33}
.card.picked .nm,.card.picked .ix{color:#04240f}
.card.picked::after{content:"";position:absolute;inset:-4%;border-radius:calc(var(--cw)*.1);border:3px solid #9cf5bd;opacity:0;animation:ping 1.1s ease-out 2}
@keyframes pick{
  0%{transform:scale(1) rotateY(0)}
  35%{transform:scale(1.34) rotateY(200deg)}
  70%{transform:scale(1.08) rotateY(345deg)}
  100%{transform:scale(1.14) rotateY(360deg)}
}
@keyframes ping{0%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(1.32)}}
.card.target{z-index:7}
.card.target .card-body{box-shadow:0 0 0 calc(var(--cw)*.026) var(--amber),0 0 calc(var(--cw)*.14) calc(var(--cw)*.03) rgba(255,176,32,.75),0 calc(var(--cw)*.03) 0 var(--edge)}
.card.target{transform:scale(1.07)}
.card.pickable{cursor:pointer}
.card.pickable:hover .card-body{transform:translateY(-4px)}
.card.pickable .card-body{animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18)}}

.card.out .card-body{filter:saturate(.1) brightness(.34) contrast(1.1)}
.card.out{z-index:2}
.card .xm{position:absolute;z-index:9;inset:-3% -3%;width:106%;height:106%;overflow:visible;pointer-events:none;display:none}
.card.out .xm{display:block}
.xm path{fill:none;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0}
.xm .glow{stroke:#ff1744;stroke-width:17;opacity:.6;filter:blur(6px)}
.xm .main{stroke:#ff2a48;stroke-width:11}
.xm .core{stroke:#ffd3da;stroke-width:3}
.card.fresh{animation:shake .55s}
.card.fresh .l1{animation:draw .2s ease-out both}
.card.fresh .l2{animation:draw .2s .17s ease-out both}
.card.fresh .xg{transform-origin:50% 50%;animation:slam .5s cubic-bezier(.2,1.5,.4,1) both}
.card.fresh::before{content:"";position:absolute;inset:0;z-index:10;border-radius:calc(var(--cw)*.075);background:#ff1744;mix-blend-mode:screen;opacity:0;animation:flash .5s ease-out}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes slam{0%{transform:scale(1.9);opacity:0}35%{opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:none}15%{transform:translate(-7px,3px) rotate(-1.6deg)}30%{transform:translate(6px,-3px) rotate(1.4deg)}45%{transform:translate(-5px,2px)}60%{transform:translate(4px,-2px)}80%{transform:translate(-2px,1px)}}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}

}

/* Diyalog: buttons=[{label,kind,value,onClick(ctx)}] */
function dialog({title,body,buttons,wide,onReady,dismiss=true}){
  return new Promise(resolve=>{
    const ov=document.createElement('div');
    ov.className='ov';
    ov.innerHTML=`<div class="dlg ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <h3>${esc(title)}</h3><div class="dlg-body">${body||''}</div><div class="dlg-actions"></div></div>`;
    document.body.appendChild(ov);
    const acts=$('.dlg-actions',ov);
    const close=v=>{ document.removeEventListener('keydown',onKey); ov.remove(); resolve(v); };
    const ctx={ov,close,setError:m=>{ const e=$('.err',ov); if(e) e.textContent=m||''; }};
    (buttons||[]).forEach(b=>{
      const el=document.createElement('button');
      el.className='btn '+(b.kind||'ghost');
      el.textContent=b.label;
      el.addEventListener('click',async()=>{
        if(b.onClick){ el.disabled=true; try{ await b.onClick(ctx); }finally{ el.disabled=false; } }
        else close(b.value);
      });
      acts.appendChild(el);
    });
    function onKey(e){ if(e.key==='Escape' && dismiss) close(null); }
    document.addEventListener('keydown',onKey);
    ov.addEventListener('mousedown',e=>{ if(e.target===ov && dismiss) close(null); });
    if(onReady) onReady(ctx);
    const f=$('input,textarea',ov); if(f) f.focus();
  });
}

/* ---------- Ses ---------- */
const Snd=(()=>{
  let ctx=null, on=lsGet('wn_snd')!=='0';
  const c=()=>{ if(!ctx){ try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(ctx&&ctx.state==='suspended') ctx.resume(); return ctx; };
  const beep=(f,d,type,v,when)=>{

    const o=a.createOscillator(), g=a.createGain(); o.type=type||'square'; o.frequency.value=f;

    const t=a.currentTime+(when||0); g.gain.setValueAtTime(v||.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);

/* ---------- Şifre özeti (akıllı tahta şifresi düz metin olarak saklanmaz) ---------- */
const hasSubtle = ()=>!!(window.crypto && crypto.subtle);
async function hashPw(pw,cid,algo){
  if(algo==='p1'){
    const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode('wn:'+cid),iterations:120000},key,256);
    return 'p1:'+Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  let h1=0x811c9dc5,h2=5381; const s='wn:'+cid+':'+pw;
  for(let i=0;i<s.length;i++){ h1^=s.charCodeAt(i); h1=Math.imul(h1,16777619)>>>0; h2=((h2<<5)+h2+s.charCodeAt(i))>>>0; }
  return 'f1:'+h1.toString(16)+h2.toString(16);
}
const makePwHash = (pw,cid)=>hashPw(pw,cid,hasSubtle()?'p1':'f1');
async function verifyPw(pw,cid,stored){
  if(!stored) return false;
  const algo=stored.slice(0,2);
  if(algo==='p1' && !hasSubtle()) throw new Error('Bu tarayıcıda güvenli bağlantı (https) gerekiyor.');
  return (await hashPw(pw,cid,algo))===stored;
}

async function claimCode(code,cid){
  const r=await db.ref(`${ROOT}/codeIndex/${code}`).transaction(cur=>cur===null?cid:undefined);
  return r.committed;
}

function viewLogin(intent){
  clearListeners();
  const isAdmin=intent==='admin';
  authShell(`
    <h2>${isAdmin?'Yönetici Girişi':'Öğretmen Girişi'}</h2>
    <p class="sub">${isAdmin?'The Agents ile aynı yönetici hesabını kullan.':'Hesabın yönetici tarafından oluşturulur. The Agents veya ClassClans hesabınla da girebilirsin.'}</p>
    <div class="field"><label class="f" for="em">E-posta</label><input class="inp" id="em" type="email" autocomplete="username" placeholder="ornek@okul.com"></div>
    <div class="field"><label class="f" for="pw">Şifre</label><input class="inp" id="pw" type="password" autocomplete="current-password"></div>
    <p class="err" id="lerr" role="alert"></p>
    <div class="row" style="margin-top:.6rem">
      <button class="btn red grow" id="doLogin">Giriş yap</button>
      <button class="btn ghost" id="back">Geri</button>
    </div>
    ${isAdmin?'':'<div style="text-align:center;margin-top:.9rem"><button class="linklike" id="forgot">Şifremi unuttum</button></div>'}`);
  const go=async()=>{
    const email=$('#em').value.trim().toLowerCase(), pw=$('#pw').value, err=$('#lerr');
    err.textContent='';
    if(!email||!pw){ err.textContent='E-posta ve şifreyi gir.'; return; }
    if(!fbOk){ err.textContent='Bağlantı hazır değil, sayfayı yenile.'; return; }
    const b=$('#doLogin'); b.disabled=true;
    try{
      let cred;
      try{ cred=await auth.signInWithEmailAndPassword(email,pw); }
      catch(e){ throw new Error('E-posta veya şifre hatalı.'); }
      await afterAuth(cred.user,{intent});
    }catch(e){ err.textContent=friendly(e); b.disabled=false; }
  };
  $('#doLogin').onclick=go;
  $('#pw').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
  $('#em').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#pw').focus(); });
  $('#back').onclick=viewHome;
  const f=$('#forgot');
  if(f) f.onclick=async()=>{
    const email=$('#em').value.trim().toLowerCase();
    if(!email){ $('#lerr').textContent='Önce e-posta adresini yaz, sonra "Şifremi unuttum"a bas.'; return; }
    try{ await auth.sendPasswordResetEmail(email); toast('Şifre sıfırlama bağlantısı e-postana gönderildi.','ok'); }
    catch(e){ $('#lerr').textContent='Bağlantı gönderilemedi: '+friendly(e); }
  };
  setTimeout(()=>$('#em')&&$('#em').focus(),30);
}

async function afterAuth(user,opts={}){
  S.user=user;
  const isAdmin=user.uid===ADMIN_UID;
  if(opts.intent==='admin'){
    if(!isAdmin){ await auth.signOut(); throw new Error('Bu hesap yönetici hesabı değil.'); }
    S.mode='admin'; return viewAdmin();
  }
  if(isAdmin){ S.rec={}; S.mode='teacher'; return viewTeacherHome(); }   // yönetici, öğretmen girişinden girince öğretmen paneli açılır
  const rec=(await db.ref('admin/teachers/'+user.uid).once('value')).val();
  if(!rec){ await auth.signOut(); throw new Error('Bu hesap için öğretmen kaydı bulunamadı. Yöneticinle iletişime geç.'); }
  if(rec.suspended){ await auth.signOut(); throw new Error('Bu hesap yönetici tarafından askıya alınmış.'); }
  const ids=Object.keys((await db.ref(`${ROOT}/teachers/${user.uid}/classIds`).once('value')).val()||{});
  if(rec.wnMaxClasses===0 && ids.length===0){ await auth.signOut(); throw new Error("Bu hesabın Who's Next'i kullanma izni yok. Yöneticinle iletişime geç."); }
  S.rec=rec; S.mode='teacher';
  viewTeacherHome();
}
async function logout(){
  try{ await auth.signOut(); }catch(e){}
  S.user=null; S.rec=null; viewHome();
}

function viewBoardLogin(){
  clearListeners();
  authShell(`
    <h2>Akıllı Tahta Girişi</h2>
    <p class="sub">Öğretmenin sana verdiği sınıf kodunu ve tahta şifresini gir.</p>
    <div class="field"><label class="f" for="bc">Sınıf kodu</label><input class="inp" id="bc" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ör. K7M2QX" style="letter-spacing:.18em;font-weight:700;text-transform:uppercase"></div>
    <div class="field"><label class="f" for="bp">Şifre</label><input class="inp" id="bp" type="password" autocomplete="off"></div>
    <p class="err" id="lerr" role="alert"></p>
    <div class="row" style="margin-top:.6rem">
      <button class="btn blue grow" id="doBoard">Oyunu aç</button>
      <button class="btn ghost" id="back">Geri</button>
    </div>`);
  const go=async()=>{
    const err=$('#lerr'); err.textContent='';
    const b=$('#doBoard'); b.disabled=true;
    try{ await boardLogin($('#bc').value,$('#bp').value); }
    catch(e){ err.textContent=friendly(e); b.disabled=false; }
  };
  $('#doBoard').onclick=go;
  $('#bp').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
  $('#bc').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#bp').focus(); });
  $('#back').onclick=viewHome;
  setTimeout(()=>$('#bc')&&$('#bc').focus(),30);
}
async function boardLogin(codeRaw,pw){
  const code=normCode(codeRaw);
  const bad=new Error('Sınıf kodu veya şifre hatalı.');
  if(!code||!pw) throw new Error('Sınıf kodunu ve şifreyi gir.');
  if(!fbOk) throw new Error('Bağlantı hazır değil, sayfayı yenile.');
  const cid=(await db.ref(`${ROOT}/codeIndex/${code}`).once('value')).val();
  if(!cid) throw bad;
  const meta=(await db.ref(`${ROOT}/classes/${cid}/meta`).once('value')).val();
  if(!meta) throw bad;
  if(!meta.pw) throw new Error('Bu sınıf için akıllı tahta şifresi henüz belirlenmemiş. Öğretmenin şifre belirlemesi gerekiyor.');
  if(!(await verifyPw(pw,cid,meta.pw))) throw bad;
  lsSet('wn_board',JSON.stringify({cid,pw:meta.pw}));
  S.mode='board';
  viewGame(cid,'board');
}
async function tryBoardResume(){
  try{
    const s=JSON.parse(lsGet('wn_board')||'null'); if(!s||!s.cid) return false;
    const meta=(await db.ref(`${ROOT}/classes/${s.cid}/meta`).once('value')).val();
    if(!meta||meta.pw!==s.pw){ lsDel('wn_board'); return false; }
    S.mode='board'; viewGame(s.cid,'board'); return true;
  }catch(e){ return false; }
}

const limitOf=rec=>(rec&&typeof rec.wnMaxClasses==='number')?rec.wnMaxClasses:Infinity;

async function viewTeacherHome(){
  clearListeners(); S.mode='teacher'; splash();
  document.title="Sınıflarım | Who's Next?";
  let rec, ids, classes=[];
  try{
    rec=(await db.ref('admin/teachers/'+S.user.uid).once('value')).val()||S.rec||{};
    S.rec=rec;
    ids=Object.keys((await db.ref(`${ROOT}/teachers/${S.user.uid}/classIds`).once('value')).val()||{});
    classes=(await Promise.all(ids.map(async id=>{
      const [m,st,q]=await Promise.all([
        db.ref(`${ROOT}/classes/${id}/meta`).once('value'),
        db.ref(`${ROOT}/classes/${id}/students`).once('value'),
        db.ref(`${ROOT}/classes/${id}/questions`).once('value')]);
      const meta=m.val(); if(!meta) return null;
      return {id,meta,sc:Object.keys(st.val()||{}).length,qc:Object.keys(q.val()||{}).length};
    }))).filter(Boolean).sort((a,b)=>(a.meta.createdAt||0)-(b.meta.createdAt||0));
  }catch(e){ app.innerHTML=''; toast(friendly(e),'err'); return viewHome(); }
  const lim=limitOf(rec), count=classes.length, full=count>=lim;
  const name=rec.displayName||S.user.email;
  app.innerHTML=`${topbar(`<span class="chip">${esc(name)}</span><button class="btn ghost sm" id="lo">Çıkış</button>`)}
  <div class="page">
    <h1>Sınıflarım</h1>
    <p class="lead">${lim===Infinity?'Sınıf oluşturma hakkın: sınırsız.':`Sınıf hakkın: <b>${count} / ${lim}</b> kullanıldı.`}</p>
    <div class="class-grid">
      ${classes.map(c=>`
        <div class="panel class-card">
          <h3>${esc(c.meta.name||'Sınıf')}</h3>
          <div class="meta"><span class="chip code">${esc(c.meta.code)}</span><span class="chip">${c.sc} öğrenci</span><span class="chip">${c.qc} soru</span></div>
          <div class="acts">
            <button class="btn blue sm" data-manage="${c.id}">Yönet</button>
            <button class="btn red sm" data-play="${c.id}">▶ Oyunu Başlat</button>
          </div>
        </div>`).join('')}
      <button class="class-new" id="newClass" ${full?'disabled':''}>
        <span class="plus">+</span><span>Sınıf oluştur</span>
        ${full?`<span class="hint">Sınıf hakkın doldu${lim===0?' (0)':''}. Daha fazlası için yöneticine ulaş.</span>`:''}
      </button>
    </div>
  </div>`;
  $('#lo').onclick=logout;
  $('#brandHome').onclick=e=>{ e.preventDefault(); viewTeacherHome(); };
  $$('[data-manage]').forEach(b=>b.onclick=()=>viewClass(b.dataset.manage));
  $$('[data-play]').forEach(b=>b.onclick=()=>startGameFlow(b.dataset.play));
  $('#newClass').onclick=async()=>{
    if(full) return;
    const v=await askText({title:'Yeni sınıf',label:'Sınıf adı',placeholder:'ör. 9-A Fizik',ok:'Oluştur',validate:x=>x.trim()?'':'Sınıf adını yaz.'});
    if(v==null) return;
    try{
      // hakkı tekrar kontrol et (yönetici bu arada değiştirmiş olabilir)
      const fresh=(await db.ref('admin/teachers/'+S.user.uid).once('value')).val()||{};
      const cur=Object.keys((await db.ref(`${ROOT}/teachers/${S.user.uid}/classIds`).once('value')).val()||{}).length;
      if(cur>=limitOf(fresh)){ toast('Sınıf hakkın doldu.','err'); return viewTeacherHome(); }
      const cid=await createClass(v.trim());
      toast('Sınıf oluşturuldu. Sınıf kodu otomatik verildi.','ok');
      viewClass(cid);
    }catch(e){ toast(friendly(e),'err'); }
  };
}

async function createClass(name){
  const uid=S.user.uid;
  const cid=db.ref(`${ROOT}/classes`).push().key;
  let code=null;
  for(let i=0;i<12 && !code;i++){ const c=randCode(); if(await claimCode(c,cid)) code=c; }
  if(!code) throw new Error('Benzersiz bir kod üretilemedi, tekrar dene.');
  try{
    await db.ref().update({
      [`${ROOT}/classes/${cid}/meta`]:{name,code,ownerUid:uid,createdAt:firebase.database.ServerValue.TIMESTAMP,manualMode:false},
      [`${ROOT}/teachers/${uid}/classIds/${cid}`]:true
    });
  }catch(e){ db.ref(`${ROOT}/codeIndex/${code}`).remove().catch(()=>{}); throw e; }
  return cid;
}

function setTab(t){
  C.tab=t;
  $$('.tab').forEach(x=>{ const on=x.dataset.tab===t; x.classList.toggle('on',on); x.setAttribute('aria-selected',on); });
  $$('[data-pane]').forEach(p=>p.hidden=p.dataset.pane!==t);
}
function paintClassHeader(){
  if(!C||!C.meta) return;
  $('#cName').textContent=C.meta.name||'Sınıf';
  $('#cCode').textContent=C.meta.code||'';
  $('#cCount').textContent=`${C.students.length} öğrenci`;
  $('#pwWarn').innerHTML=C.meta.pw?'':`<div class="chip warn">Akıllı tahta girişi için henüz şifre belirlemedin. <button class="linklike" id="goPw" style="color:#ffd894">Şifre belirle</button></div>`;
  const g=$('#goPw'); if(g) g.onclick=()=>{ setTab('settings'); const i=$('#pwIn'); if(i) i.focus(); };
}

async function changeCodeDialog(){
  const cur=C.meta.code;
  const v=await askText({
    title:'Sınıf kodunu değiştir',label:'Yeni sınıf kodu',value:randCode(),ok:'Kodu değiştir',
    hint:'Sana rastgele bir kod önerdik; beğenmezsen kendi kodunu yazabilirsin (4-10 harf/rakam, Türkçe karakter yok). Aynı kod iki sınıfta kullanılamaz.',
    validate:x=>{ const c=normCode(x); if(c.length<4||c.length>10) return 'Kod 4-10 karakter olmalı (yalnızca A-Z ve 0-9).'; if(c===cur) return 'Bu zaten şu anki kodun.'; return ''; }
  });
  if(v==null) return;
  const code=normCode(v);
  try{
    if(!(await claimCode(code,C.cid))){ toast('Bu kod başka bir sınıfta kullanılıyor. Farklı bir kod dene.','err'); return; }
    await db.ref(C.base+'/meta/code').set(code);
    await db.ref(`${ROOT}/codeIndex/${cur}`).remove();
    toast('Sınıf kodu değişti: '+code,'ok');
  }catch(e){ toast(friendly(e),'err'); }
}

      <label class="f" for="stName">Öğrenci kullanıcı adı</label>

      else { inp.value=''; inp.focus(); }

  $('#xlBtn').onclick=()=>$('#xl').click();

      if(!window.XLSX) throw new Error('Excel okuyucu yüklenemedi (internet bağlantını kontrol et).');

      if(r.skippedCap) msg+=` ${r.skippedCap} ad sınır (${MAX_STUDENTS}) yüzünden eklenmedi.`;

    :'<div class="empty" style="grid-column:1/-1">Henüz öğrenci yok. Yukarıdan tek tek ekle ya da Excel dosyası yükle.</div>';
  $$('[data-del]',l).forEach(b=>b.onclick=async()=>{ try{ await db.ref(`${C.base}/students/${b.dataset.del}`).remove(); }catch(e){ toast(friendly(e),'err'); } });
}
async function addStudents(names){
  const existing=new Set(C.students.map(s=>norm(s.name)));
  let ord=C.students.reduce((m,s)=>Math.max(m,s.ord||0),0), added=0,dups=0,skippedCap=0;
  const room=MAX_STUDENTS-C.students.length, upd={};
  for(const raw of names){
    const n=String(raw==null?'':raw).trim().replace(/\s+/g,' ').slice(0,40); if(!n) continue;
    const k=norm(n);
    if(existing.has(k)){ dups++; continue; }
    if(added>=room){ skippedCap++; continue; }
    existing.add(k);
    upd[`${C.base}/students/${db.ref().push().key}`]={name:n,ord:++ord}; added++;
  }
  if(added) await db.ref().update(upd);
  return {added,dups,skippedCap};
}
async function readExcelNames(file){
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(buf,{type:'array'});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,blankrows:false,defval:''});
  const col=rows.map(r=>String((r&&r[0])==null?'':r[0]).trim());
  if(col.length && /^(öğrenci|ogrenci|kullanıcı|kullanici|kullan|adı|isim|ad soyad|name|user)/i.test(col[0])) col.shift();
  return col.filter(Boolean);
}

function fileToDataURL(file,max=1200,quality=.8){
  return new Promise((res,rej)=>{
    if(!/^image\//.test(file.type)){ rej(new Error('Lütfen bir görsel dosyası seç.')); return; }
    const fr=new FileReader();
    fr.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const s=Math.min(1,max/Math.max(im.width,im.height));
        const c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s);
        const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',quality));
      };
      im.onerror=()=>rej(new Error('Görsel okunamadı.')); im.src=fr.result;
    };
    fr.onerror=()=>rej(new Error('Dosya okunamadı.')); fr.readAsDataURL(file);
  });
}

/* ---------- Durum yardımcıları ---------- */
const gTurn=()=>GV.G.turn||null;
function pendingSet(){ const t=gTurn(); return new Set(t&&t.phase==='result'?(t.victims||[]):[]); }
function isOutVis(id){ return !!(GV.G.eliminated&&GV.G.eliminated[id]) && !pendingSet().has(id); }
function aliveVis(){ return GV.students.filter(s=>!isOutVis(s.id)); }
function nameOf(id){ const s=GV.students.find(x=>x.id===id); return s?s.name:'?'; }
function dphase(t){ if(!t) return 'idle'; if(t.phase==='spin') return GV.revealed===t.id?'reveal':'spin'; return t.phase; }
function answerers(t){ return t.event==='together'?[t.studentId,t.targetId].filter(Boolean):(t.event==='pass'?[t.targetId].filter(Boolean):[t.studentId]); }
function overState(){
  const t=gTurn(), G=GV.G;
  if(GV.students.length<2||(G.round||0)<=0) return null;
  if(t&&t.phase!=='done') return null;
  const alive=aliveVis().length;
  if(alive===0) return 'none';
  if(alive===1) return 'last';
  const solved=G.solved||{};
  if(!GV.meta.manualMode && GV.questions.length>0 && GV.questions.every(q=>solved[q.id])) return 'solved';
  return null;
}
const computeOver=()=>!!overState();
function refresh(){
  if(!GV||!GV.ready.st||!GV.ready.g||!GV.ready.meta) return;
  applyStates(); renderTop(); renderDock(); renderModal(); renderLB(); syncOver();
  GV.primed=true;
}

/* Firebase işlem sarmalayıcısı: iki ekran aynı anda dokunsa bile çakışmaz */
function mutateGame(fn){
  return GV.gameRef.transaction(cur=>{ const g=cur||{}; const r=fn(g); return r===undefined?undefined:r; },
    (err)=>{ if(err) dbErr(err); }, false);
}

/* ---------- Kart ızgarası ---------- */
function buildCards(){
  const grid=$('#grid'); if(!grid||!GV) return;
  const key=GV.students.map(s=>s.id+':'+s.name).join('|');
  if(GV.cardIds===key) return;
  GV.cardIds=key;
  grid.innerHTML=GV.students.map((s,i)=>`<div class="card" data-id="${s.id}"><div class="card-body"><i class="slot"></i><span class="ix">${i+1}</span><div class="nm"></div><div class="rb"></div></div><div class="tk">${TICKET_SVG}<b></b></div>${XMARK_SVG}</div>`).join('');
  $$('.card',grid).forEach((el,i)=>{ $('.nm',el).textContent=GV.students[i].name; });
  GV.fitCache='';
  layoutGrid();
}
function fitName(name,cw){
  const ch=cw/1.5, aw=cw*.88, ah=ch*.43, len=Math.max(1,name.length);
  for(let fs=cw*.19;fs>=cw*.06;fs-=.5){
    const per=Math.max(1,Math.floor(aw/(fs*.66)));
    const lines=Math.ceil(len/per);
    if(lines*fs*1.08<=ah) return fs;
  }
  return cw*.06;
}
function layoutGrid(){
  const main=$('#gMain'), grid=$('#grid'); if(!main||!grid||!GV) return;
  const n=GV.students.length; if(!n) return;
  const cs=getComputedStyle(main);
  const W=main.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const H=main.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  if(W<50||H<50) return;
  const gap=clamp(Math.min(W,H)*.022,8,22), R=1.5;
  let best={cw:0,c:1};
  for(let c=1;c<=n;c++){
    const rows=Math.ceil(n/c), w=(W-(c-1)*gap)/c, h=(H-(rows-1)*gap)/rows, cw=Math.min(w,h*R);
    if(cw>best.cw) best={cw,c};
  }
  const cw=Math.max(96,Math.floor(best.cw*.94)), ch=Math.round(cw/R), cols=best.c, rows=Math.ceil(n/cols);
  grid.style.setProperty('--cols',cols); grid.style.setProperty('--cw',cw+'px'); grid.style.setProperty('--ch',ch+'px'); grid.style.setProperty('--gap',gap+'px');
  main.style.overflowY=(rows*ch+(rows-1)*gap>H)?'auto':'hidden'; main.style.overflowX='hidden';
  $$('.card',grid).forEach((el,i)=>{
    const p=PALETTE[(i+Math.floor(i/cols)*2)%PALETTE.length];
    el.style.setProperty('--c1',p.c1); el.style.setProperty('--c2',p.c2); el.style.setProperty('--edge',p.edge); el.style.setProperty('--ink',p.ink);
    el.style.setProperty('--fs',fitName(GV.students[i].name,cw).toFixed(1)+'px');
    el.style.setProperty('--rfs',Math.max(9,cw*.083).toFixed(1)+'px');
  });
}

function setScan(id){ $$('.card.scan').forEach(e=>e.classList.remove('scan')); if(id){ const el=$(`.card[data-id="${id}"]`); if(el) el.classList.add('scan'); } }

function applyStates(){
  const grid=$('#grid'); if(!grid) return;
  const G=GV.G, t=gTurn(), ph=dphase(t), out=G.eliminated||{}, tk=G.tickets||{}, pend=pendingSet();
  const live=t&&(ph==='reveal'||ph==='question'||ph==='result');
  const pickId=live?t.studentId:null, tgtId=(live&&t.targetId)?t.targetId:null;
  const selecting=t&&ph==='reveal'&&(t.event==='pass'||t.event==='together');
  $$('.card',grid).forEach(el=>{
    const id=el.dataset.id, isOut=!!out[id]&&!pend.has(id);
    if(isOut){
      if(!el.classList.contains('out')){
        el.classList.add('out');
        if(GV.primed&&!GV.seenOut.has(id)){ el.classList.add('fresh'); setTimeout(()=>el.classList.remove('fresh'),1600); Snd.out(); }
      }
      GV.seenOut.add(id);
    }else{ el.classList.remove('out','fresh'); GV.seenOut.delete(id); }
    el.classList.toggle('scan',GV.scanId===id);
    el.classList.toggle('picked',id===pickId);
    el.classList.toggle('target',id===tgtId);
    el.classList.toggle('pickable',!!selecting&&id!==t.studentId&&!isOut);
    let rb='',bg='',fg='';
    if(id===pickId){ rb=EVENTS[t.event].name; bg=EVENTS[t.event].rb; fg=EVENTS[t.event].rbt; }
    else if(id===tgtId){ rb=t.event==='pass'?'Pas geldi':'Destekçi'; bg='#ffb020'; fg='#2a1600'; }
    if(el._rb!==rb){
      el._rb=rb; const r=$('.rb',el);
      if(rb){ r.textContent=rb.toLocaleUpperCase('tr'); r.style.setProperty('--rb',bg); r.style.setProperty('--rbt',fg); r.style.background=bg; r.style.color=fg; }
      el.classList.toggle('has-rb',!!rb);
    }
    const n=isOut?0:(tk[id]||0);
    el.classList.toggle('has-tk',n>0);
    $('.tk b',el).textContent=n>1?'×'+n:'';
    if(n>(el._tk||0)&&GV.primed){ el.classList.remove('tk-pop'); void el.offsetWidth; el.classList.add('tk-pop'); }
    el._tk=n;
  });
}

/* ---------- Üst çubuk ---------- */
function renderTop(){
  const t=gTurn(), G=GV.G, alive=aliveVis().length, total=GV.students.length;
  const busy=!!(t&&t.phase!=='done'), over=computeOver();
  const b=$('#gPlay');
  b.disabled=over||busy||total<2||alive<2;
  b.textContent=busy?'TUR SÜRÜYOR':((G.round||0)>0?'TURU BAŞLAT':'OYNAT');
  const solvedN=G.solved||{}, left=GV.meta.manualMode?null:GV.questions.filter(q=>!solvedN[q.id]).length;
  $('#gStat').innerHTML=`${(G.round||0)>0?`Tur <b>${G.round}</b> &nbsp;·&nbsp; `:''}Kalan <b>${alive}</b>/${total}${(left!=null&&GV.questions.length)?` &nbsp;·&nbsp; Soru <b>${left}</b>`:''}`;
}

/* ---------- Tur başlatma ve dönen çerçeve ---------- */
/* Durum ağırlıkları (yüzde): Boş tur azaltıldı, artan pay "Soruyu Cevapla"ya gitti.
   Oyunda bir bilet varken "Öğretmen Desteği Bileti" çıkmaz; payı "Soruyu Cevapla"ya gider. */
const EVENT_W={answer:30,empty:10,pass:20,ticket:20,together:20};
const ticketCount=g=>Object.values(g.tickets||{}).reduce((s,n)=>s+(n>0?n:0),0);
function pickEvent(g){
  const w=Object.assign({},EVENT_W);
  if(ticketCount(g)>=1){ w.answer+=w.ticket; w.ticket=0; }
  let r=Math.random()*EVENT_KEYS.reduce((s,k)=>s+w[k],0);
  for(const k of EVENT_KEYS){ if(r<w[k]) return k; r-=w[k]; }
  return 'answer';
}
function planSpin(g){
  const out=g.eliminated||{};
  const ids=GV.students.filter(s=>!out[s.id]).map(s=>s.id), n=ids.length;
  if(n<2) return null;
  const start=Math.floor(Math.random()*n), win=Math.floor(Math.random()*n);
  const laps=Math.max(2,Math.ceil(38/n));
  const steps=laps*n+((win-start+n)%n);
  const base=clamp(2600/n,40,110);
  const path=[], cum=[]; let tt=0;
  for(let i=0;i<=steps;i++){
    path.push(ids[(start+i)%n]);
    const rem=steps-i, dec=rem<10?1+1.7*Math.pow((10-rem)/10,2):1;
    tt+=base*dec; cum.push(Math.round(tt));
  }
  return {id:now()+'_'+Math.floor(Math.random()*1e6),studentId:path[steps],
          event:pickEvent(g),
          t0:Math.round(now()+700),path,cum,phase:'spin'};
}
function startTurn(){
  mutateGame(g=>{
    if(g.turn&&g.turn.phase!=='done') return;
    const p=planSpin(g); if(!p) return;
    g.round=(g.round||0)+1; p.round=g.round; g.turn=p; return g;
  });
}
function trackTurn(){
  const t=gTurn();
  if(!t){ stopAnim(); GV.trackedTurn=null; GV.revealed=null; return; }
  if(t.id!==GV.trackedTurn){
    GV.trackedTurn=t.id; stopAnim(); GV.revealed=null;
    if(t.phase==='spin') startAnim(t); else GV.revealed=t.id;
  }
}
function stopAnim(){ cancelAnimationFrame(GV.raf); GV.raf=0; GV.scanId=null; setScan(null); }
function startAnim(t){
  const total=t.cum[t.cum.length-1];
  if(now()-t.t0>=total){ finishSpin(t,true); return; }
  GV.lastIdx=-1;
  const loop=()=>{
    if(!GV) return;
    const e=now()-t.t0;
    if(e<0){ GV.raf=requestAnimationFrame(loop); return; }
    if(e>=total){ GV.raf=0; finishSpin(t,false); return; }
    let lo=0,hi=t.cum.length-1;
    while(lo<hi){ const m=(lo+hi)>>1; if(t.cum[m]>e) hi=m; else lo=m+1; }
    if(lo!==GV.lastIdx){ GV.lastIdx=lo; GV.scanId=t.path[lo]; setScan(GV.scanId); Snd.tick(); }
    GV.raf=requestAnimationFrame(loop);
  };
  GV.raf=requestAnimationFrame(loop);
}
function finishSpin(t,silent){
  GV.scanId=null; setScan(null); GV.revealed=t.id;
  if(!silent){ Snd.pick(); if(t.event==='ticket') confetti(46); }
  refresh();
  if((t.event==='empty'||t.event==='ticket') && GV.autoFor!==t.id){
    GV.autoFor=t.id; clearTimeout(GV.autoTimer);
    GV.autoTimer=setTimeout(()=>{
      if(!GV) return;
      mutateGame(g=>{
        const tt=g.turn; if(!tt||tt.id!==t.id||tt.phase!=='spin') return;
        if(tt.event==='ticket' && ticketCount(g)<1){ g.tickets=g.tickets||{}; g.tickets[tt.studentId]=(g.tickets[tt.studentId]||0)+1; }
        tt.phase='done'; return g;
      });
    },silent?600:2800);
  }
}

/* ---------- Kart seçimi (pasla / birlikte çözelim) ---------- */
function onCardClick(e){
  const el=e.target.closest('.card'); if(!el||!GV) return;
  const t=gTurn(); if(!t||dphase(t)!=='reveal') return;
  if(t.event!=='pass'&&t.event!=='together') return;
  const id=el.dataset.id; if(id===t.studentId||isOutVis(id)) return;
  Snd.unlock();
  mutateGame(g=>{ const tt=g.turn; if(!tt||tt.id!==t.id||tt.phase!=='spin') return; tt.targetId=id; return g; });
}

/* ---------- Alt bilgi alanı ---------- */
const evtChip=k=>`<span class="evt" style="--rb:${EVENTS[k].rb};color:${EVENTS[k].rbt}">${EVENTS[k].name}</span>`;
function renderDock(){
  const dock=$('#dock'); if(!dock) return;
  const t=gTurn(), ph=dphase(t), total=GV.students.length, alive=aliveVis().length;
  let h='';
  if(total<2) h=`<div class="col"><div class="ttl">En az 2 öğrenci gerekli</div><div class="sub">Öğretmen panelinden öğrenci ekle.</div></div>`;
  else if(computeOver()) h=`<div class="col"><div class="ttl">Oyun bitti</div></div>`;
  else if(!t||ph==='done'||ph==='idle') h=`<div class="col"><div class="ttl">${(GV.G.round||0)>0?'Sıradaki tur için hazır':'Hazır mısınız?'}</div><div class="sub">${GV.meta.manualMode?'Sorular sınıfta çözdürülecek; sonucu öğretmen seçecek.':'Yukarıdaki düğmeye bas, mor çerçeve sıradakini seçsin.'}</div></div>`;
  else if(ph==='spin') h=`<div class="col"><div class="ttl">Seçim dönüyor…</div><div class="sub">Sıradaki kim olacak?</div></div>`;
  else if(ph==='question') h=`<div class="col"><div class="ttl">Soru ekranda</div></div>`;
  else if(ph==='result') h=`<div class="col"><div class="ttl">Sonuç ekranda</div></div>`;
  else if(ph==='reveal'){
    const me=esc(nameOf(t.studentId)), tg=t.targetId?esc(nameOf(t.targetId)):'';
    const open=`<div class="btns"><button class="btn green lg" data-act="open">Soruyu aç</button></div>`;
    if(t.event==='answer') h=`<div class="col"><div class="ttl">${evtChip('answer')}</div><div class="sub"><b>${me}</b> soruyu cevaplayacak.</div></div>${open}`;
    else if(t.event==='empty') h=`<div class="col"><div class="ttl">${evtChip('empty')}</div><div class="sub">Kimse elenmedi. Tur tamamlanıyor…</div></div>`;
    else if(t.event==='ticket') h=`<div class="col"><div class="ttl">${evtChip('ticket')}</div><div class="sub"><b>${me}</b> bir bilet kazandı! Bilet, bir soruda öğretmenin cevap vermesini sağlar.</div></div>`;
    else if(t.event==='pass') h=t.targetId
      ?`<div class="col"><div class="ttl">${evtChip('pass')}</div><div class="sub"><b>${me}</b> soruyu pasladı. Cevaplayacak: <b>${tg}</b>. Değiştirmek için başka bir karta dokun.</div></div>${open}`
      :`<div class="col"><div class="ttl">${evtChip('pass')}</div><div class="sub"><b>${me}</b>, soruyu pasla: ekrandan bir arkadaşının kartına dokun.</div></div>`;
    else if(t.event==='together') h=t.targetId
      ?`<div class="col"><div class="ttl">${evtChip('together')}</div><div class="sub"><b>${me}</b> ve <b>${tg}</b> birlikte çözecek. Yanlış ya da boş olursa ikisi de elenir.</div></div>${open}`
      :`<div class="col"><div class="ttl">${evtChip('together')}</div><div class="sub"><b>${me}</b>, bir destekçi seç: kartına dokun.</div></div>`;
  }
  if(dock._h!==h){ dock._h=h; dock.innerHTML=h; }
  const o=$('[data-act="open"]',dock); if(o) o.onclick=openQuestion;
}

/* ---------- Soru akışı ---------- */
function openQuestion(){
  const t0=gTurn(); if(!t0) return;
  mutateGame(g=>{
    const t=g.turn; if(!t||t.id!==t0.id||t.phase!=='spin') return;
    if((t.event==='pass'||t.event==='together')&&!t.targetId) return;
    let manual=!!GV.meta.manualMode, qid=null;
    if(!manual){
      const solved=g.solved||{};
      const pool=GV.questions.map(q=>q.id).filter(id=>!solved[id]);   // doğru cevaplanan soru bir daha gelmez
      if(!pool.length) manual=true;
      else{
        let avail=pool.length>1?pool.filter(id=>id!==g.lastQ):pool;
        qid=avail[Math.floor(Math.random()*avail.length)];
        g.lastQ=qid;
      }
    }
    t.manual=manual; if(qid) t.questionId=qid; t.phase='question'; return g;
  });
}
function normAns(s){
  return String(s).toLocaleLowerCase('tr')
    .replace(/(\d)[.,](\d)/g,'$1§$2').replace(/[.,;:!?'"’‘“”()\[\]{}\-–—_\/\\*]/g,' ').replace(/§/g,'.').replace(/\s+/g,'');
}
function evalAnswer(q,given){
  if(given==null||String(given).trim()==='') return 'blank';
  if(q.answerType==='choice') return String(given).toUpperCase()===String(q.answer).toUpperCase()?'correct':'wrong';
  const g=normAns(given);
  return String(q.answer).split('|').map(normAns).filter(Boolean).includes(g)?'correct':'wrong';
}
function submitResult(result,given){
  const tid=gTurn().id;
  mutateGame(g=>{
    const t=g.turn; if(!t||t.id!==tid||t.phase!=='question') return;
    const q=t.questionId?GV.questions.find(x=>x.id===t.questionId):null;
    t.result=result; t.given=given||''; t.phase='result';
    if(q) t.correctText=answerLabel(q);
    if(result==='correct'){
      g.scores=g.scores||{};
      answerers(t).forEach(id=>{ g.scores[id]=(g.scores[id]||0)+1; });
      if(t.questionId){ g.solved=g.solved||{}; g.solved[t.questionId]=true; }
    }else{
      const v=answerers(t); g.eliminated=g.eliminated||{}; g.tickets=g.tickets||{};
      v.forEach(id=>{ g.eliminated[id]=true; delete g.tickets[id]; });
      t.victims=v;
    }
    return g;
  });
}
function useTicket(holder){
  const tid=gTurn().id;
  mutateGame(g=>{
    const t=g.turn; if(!t||t.id!==tid||t.phase!=='question') return;
    if(!(g.tickets&&g.tickets[holder]>0)) return;
    g.tickets[holder]--; if(g.tickets[holder]<=0) delete g.tickets[holder];
    const q=t.questionId?GV.questions.find(x=>x.id===t.questionId):null;
    if(q){ t.correctText=answerLabel(q); g.solved=g.solved||{}; g.solved[q.id]=true; }
    t.result='ticket'; t.ticketBy=holder; t.phase='result'; return g;
  });
}
function finishTurn(){
  const tid=gTurn().id;
  mutateGame(g=>{ const t=g.turn; if(!t||t.id!==tid||t.phase!=='result') return; t.phase='done'; return g; });
}

function renderModal(){
  const t=gTurn(), game=$('#game'); if(!game) return;
  let host=$('#qov');
  const show=t&&(t.phase==='question'||t.phase==='result');
  if(!show){ if(host) host.remove(); GV.modalSig=''; return; }
  const sig=[t.id,t.phase,t.result||'',t.questionId||'',t.targetId||''].join('|');
  if(host&&sig===GV.modalSig) return;
  const wasNew=!host||!GV.modalSig.startsWith(t.id+'|');
  GV.modalSig=sig;
  if(!host){ host=document.createElement('div'); host.id='qov'; host.className='qov'; game.appendChild(host); }
  const me=esc(nameOf(t.studentId)), tg=t.targetId?esc(nameOf(t.targetId)):'';
  const who=t.event==='answer'?`<b>${me}</b> cevaplıyor`
    :t.event==='pass'?`<b>${me}</b> pasladı &rarr; <b>${tg}</b> cevaplıyor`
    :`<b>${me}</b> &amp; <b>${tg}</b> birlikte çözüyor`;
  const head=`<div class="qhead">${evtChip(t.event)}<span class="who">${who}</span></div>`;
  const q=t.questionId?GV.questions.find(x=>x.id===t.questionId):null;
  const manual=!!t.manual||!q;

  if(t.phase==='question'){
    let body='';
    if(q&&q.kind==='text') body=`<div class="qbody">${esc(q.text)}</div>`;
    else if(q&&q.kind==='image') body=`<div class="qimg"><img id="qImg" alt="Soru görseli"></div>`;
    else body=`<div class="qbody">Soruyu sınıfta çözün. Cevap gelince sonucu aşağıdan seç.</div>`;
    let ans='';
    if(manual) ans=`<div class="mans"><button class="btn green" data-res="correct">Doğru</button><button class="btn red" data-res="wrong">Yanlış</button><button class="btn gray" data-res="blank">Boş</button></div>`;
    else if(q.answerType==='choice') ans=`<div class="choices">${['A','B','C','D','E'].map(x=>`<button class="btn blue" data-ch="${x}">${x}</button>`).join('')}<button class="btn gray blank" data-ch="">Boş</button></div>`;
    else ans=`<input class="inp big" id="ansIn" autocomplete="off" placeholder="Cevabını yaz" aria-label="Cevap"><div class="row"><button class="btn green lg grow" id="ansOk">Onayla</button><button class="btn gray lg" id="ansBlank">Boş bırak</button></div>`;
    const holders=GV.students.filter(s=>!isOutVis(s.id)&&((GV.G.tickets||{})[s.id]>0));
    const tkuse=holders.length?`<div class="tkuse"><span class="lbl">Öğretmen Desteği Bileti kullan:</span>${holders.map(s=>`<button class="btn amber sm" data-tk="${s.id}">${esc(s.name)}${(GV.G.tickets[s.id]>1)?' ×'+GV.G.tickets[s.id]:''}</button>`).join('')}</div>`:'';
    host.innerHTML=`<div class="qcard" role="dialog" aria-modal="true" aria-label="Soru">${head}${body}<div class="qans">${ans}</div>${tkuse}</div>`;
    if(q&&q.kind==='image') getImage(GV.cid,q.id).then(d=>{ const im=$('#qImg'); if(im&&d) im.src=d; });
    $$('[data-res]',host).forEach(b=>b.onclick=()=>submitResult(b.dataset.res,''));
    $$('[data-ch]',host).forEach(b=>b.onclick=()=>{ const v=b.dataset.ch; submitResult(evalAnswer(q,v),v); });
    const inp=$('#ansIn',host);
    if(inp){
      const ok=()=>{ const v=inp.value; submitResult(evalAnswer(q,v),v.trim()); };
      $('#ansOk',host).onclick=ok; $('#ansBlank',host).onclick=()=>submitResult('blank','');
      inp.addEventListener('keydown',e=>{ if(e.key==='Enter') ok(); });
      if(wasNew) setTimeout(()=>inp.focus(),80);
    }
    $$('[data-tk]',host).forEach(b=>b.onclick=async()=>{
      const nm=nameOf(b.dataset.tk);
      if(await confirmBox('Bilet kullanılsın mı?',`<b>${esc(nm)}</b> Öğretmen Desteği Bileti'ni bu soru için kullansın mı? Soruyu öğretmen cevaplayacak ve bilet envanterden gidecek.`,'Bileti kullan','amber')) useTicket(b.dataset.tk);
    });
  }else{
    const r=t.result, names=(t.victims||[]).map(id=>esc(nameOf(id))).join(' ve ');
    const cor=t.correctText?`<div class="cor">Doğru cevap: <b>${esc(t.correctText)}</b></div>`:'';
    let v='';
    if(r==='correct'){ v=`<div class="verdict good"><div class="big">Doğru!</div><div class="out" style="color:#a6f0c3">Kimse elenmedi.</div></div>`; Snd.ok(); }
    else if(r==='ticket'){ v=`<div class="verdict tick"><div class="big">Öğretmen cevapladı</div><div class="out" style="color:#ffe08a"><b>${esc(nameOf(t.ticketBy))}</b> Öğretmen Desteği Bileti'ni kullandı. Kimse elenmedi.</div>${cor}</div>`; Snd.ok(); }
    else{
      const given=(t.given&&r==='wrong')?`<div class="hint" style="font-size:1rem">Verilen cevap: ${esc(t.given)}</div>`:'';
      v=`<div class="verdict bad"><div class="big">${r==='blank'?'Boş':'Yanlış'}</div>${given}${cor}<div class="out">${names} elendi.</div></div>`;
    }
    host.innerHTML=`<div class="qcard" role="dialog" aria-modal="true" aria-label="Sonuç">${head}${v}<div class="row" style="justify-content:center"><button class="btn blue lg" id="contBtn">Devam</button></div></div>`;
    $('#contBtn',host).onclick=finishTurn;
    setTimeout(()=>{ const b=$('#contBtn'); if(b) b.focus(); },50);
  }
}

/* ---------- Liderlik tablosu ---------- */
const MEDALS={1:['#fff1a8','#f5b800','#8a5a00'],2:['#ffffff','#b4bdd6','#5b6480'],3:['#ffd3a6','#d07a30','#6b3a10']};
function medal(rank){
  const c=MEDALS[rank];
  return `<svg class="md" viewBox="0 0 24 28" aria-label="${rank}. sıra madalyası" role="img"><path d="M5 0h5.5l2 9H8z" fill="#3a6df0"/><path d="M19 0h-5.5l-2 9H16z" fill="#e0334c"/><circle cx="12" cy="18" r="9" fill="${c[1]}" stroke="${c[2]}" stroke-width="1.5"/><circle cx="12" cy="18" r="6.3" fill="${c[0]}" stroke="${c[2]}" stroke-width=".8"/><text x="12" y="21.4" text-anchor="middle" font-size="9" font-weight="800" fill="${c[2]}" font-family="sans-serif">${rank}</text></svg>`;
}
function renderLB(){
  const lb=$('#lb'); if(!lb) return;
  const sc=GV.G.scores||{};
  const rows=GV.students.filter(s=>(sc[s.id]||0)>0).sort((a,b)=>(sc[b.id]-sc[a.id])||(a.ord-b.ord));
  let rank=0,prev=null,i=0;
  const items=rows.map(s=>{
    i++; if(sc[s.id]!==prev){ rank=i; prev=sc[s.id]; }
    return `<li class="lbr r${rank<=3?rank:0}${isOutVis(s.id)?' out':''}"><span class="rk">${rank<=3?medal(rank):rank}</span><span class="ln" title="${esc(s.name)}">${esc(s.name)}</span><span class="ls"><b>${sc[s.id]}</b> doğru</span></li>`;
  }).join('');
  const h=`<h3>Liderlik tablosu</h3>${items?`<ol class="lbl">${items}</ol>`:'<p class="hint">Henüz doğru cevap yok. İlk doğru cevabı veren listeye girer.</p>'}`;
  if(lb._h!==h){ lb._h=h; lb.innerHTML=h; }
}

/* ---------- Bitiş ve yardımcılar ---------- */
function syncOver(){
  if(!computeOver()){
    GV.overShown=false; clearTimeout(GV.overTimer); GV.overTimer=0;
    const o=$('#over'); if(o) o.remove(); return;
  }
  if(GV.overShown||GV.overTimer) return;
  const show=()=>{
    GV.overTimer=0; if(!GV) return; GV.overShown=true;
    const st=overState(), alive=aliveVis(), game=$('#gcol'); if(!game||$('#over')||!st) return;
    const o=document.createElement('div'); o.id='over'; o.className='over';
    const rst=`<div class="row" style="justify-content:center"><button class="btn amber lg" id="ovReset">Yeni oyun başlat</button></div>`;
    if(st==='none') o.innerHTML=`<h2>Herkes elendi</h2>${rst}`;
    else if(st==='last') o.innerHTML=`<h2>Son kalan kazandı</h2><div class="win">${esc(alive[0].name)}</div>${rst}`;
    else o.innerHTML=`<h2>Tüm sorular cevaplandı!</h2><p class="sub2">Elenmeyen herkes kazandı (${alive.length} öğrenci)</p><div class="winners">${alive.map(s=>`<span class="wchip">${esc(s.name)}</span>`).join('')}</div>${rst}`;
    game.appendChild(o);
    $('#ovReset',o).onclick=resetGame;
    if(st!=='none'){ Snd.win(); confetti(120); }
  };
  if(GV.primed) GV.overTimer=setTimeout(show,2300); else show();
}
async function resetGame(){
  if(!(await confirmBox('Oyun sıfırlansın mı?','Elenenler, biletler ve tur sayısı silinecek. Öğrenciler ve sorular kalır.','Sıfırla','amber'))) return;
  try{ await GV.gameRef.remove(); toast('Oyun sıfırlandı.','ok'); }catch(e){ toast(friendly(e),'err'); }
}
function confetti(n){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols=['#ff3b57','#3aa8ff','#ffd23f','#a855f7','#34d17a','#ff8fbb'];
  for(let i=0;i<n;i++){
    const d=document.createElement('i'); d.className='cf';
    d.style.left=Math.random()*100+'vw'; d.style.background=cols[i%cols.length];
    d.style.animationDuration=(2.2+Math.random()*2.4)+'s'; d.style.animationDelay=(Math.random()*.7)+'s';
    d.style.transform=`rotate(${Math.random()*360}deg)`; d.style.width=(6+Math.random()*8)+'px';
    document.body.appendChild(d); setTimeout(()=>d.remove(),6000);
  }
}
