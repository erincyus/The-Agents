<style>

  }

  body{ margin:0; background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif; line-height:1.5; }
  button,input,textarea{ font-family:inherit; font-size:inherit; color:inherit; }
  button{ cursor:pointer; }
  a{ color:inherit; text-decoration:none; }
  :focus-visible{ outline:3px solid var(--cyan); outline-offset:2px; }
  .hidden{ display:none !important; }

  /* Üst çubuk */
  .topbar{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
    padding:12px 24px; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:30; background:rgba(10,10,12,0.94); backdrop-filter:blur(6px); }
  .brand{ display:flex; align-items:center; gap:12px; }

  .top-actions{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .who{ color:var(--muted); font-size:0.82rem; }

  .btn{ border:1px solid rgba(255,255,255,0.22); background:none; border-radius:999px; padding:9px 18px;
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:0.86rem; transition:background .15s, transform .15s; }
  .btn:hover{ background:rgba(255,255,255,0.08); }
  .btn.primary{ background:linear-gradient(90deg,var(--red),var(--cyan)); color:#0a0a0c; border-color:transparent; }
  .btn.primary:hover{ transform:translateY(-1px); filter:brightness(1.06); }
  .btn.danger{ background:var(--c-yapmadi); border-color:transparent; color:#fff; }

  main{ max-width:1300px; margin:0 auto; padding:22px 20px 60px; }

  /* Sınıf ekranı üst bölümü */

  .stat-cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; align-content:start; }
  .stat{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 20px; }
  .stat .n{ font-family:'Space Grotesk',sans-serif; font-size:2.4rem; font-weight:700; line-height:1.1; }
  .stat .l{ color:var(--muted); font-size:0.85rem; margin-top:4px; }

  .donut-box{ display:flex; flex-direction:column; align-items:center; gap:10px; }

  td.namecol .del{ float:right; background:none; border:none; opacity:.4; font-size:0.85rem; padding:0 2px; }

  th.hwh{ cursor:pointer; min-width:150px; }
  th.hwh:hover{ background:#22222c; }
  th.hwh .t{ font-family:'Space Grotesk',sans-serif; font-weight:700; }
  th.hwh .d{ font-weight:400; color:var(--muted); font-size:0.72rem; }
  th.hwh .due{ font-weight:500; color:var(--cyan); font-size:0.72rem; margin-top:2px; }
  th.hwh .note{ font-weight:400; color:#bdbdc6; font-size:0.72rem; margin-top:2px; max-width:170px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-inline:auto; }
  th.hwh.cur{ box-shadow:inset 0 3px 0 var(--cyan); }
  th.hwoff,td.offcell{ min-width:84px; background:#101014; color:#6f6f78; font-size:0.72rem; }
  th.hwoff .btn{ margin-top:4px; }
  th.endcol{ min-width:90px; background:#1b1b24; }
  td.endcol{ background:#15151b; font-weight:600; }
  tfoot td{ position:sticky; bottom:0; z-index:3; background:#1b1b24; font-weight:600; font-size:0.85rem; }
  tfoot td.namecol{ z-index:6; }

  .marks{ display:grid; grid-template-columns:repeat(2,64px); gap:4px; justify-content:center; }
  .mk{ border:1px solid rgba(255,255,255,0.18); background:transparent; border-radius:8px; padding:4px 2px; font-size:0.66rem; font-weight:600; color:#b5b5be; line-height:1.2; }
  .mk:hover{ background:rgba(255,255,255,0.10); color:#fff; }
  .mk.on.yapti{ background:var(--c-yapti); color:#052611; border-color:transparent; }
  .mk.on.eksik{ background:var(--c-eksik); color:#2b2200; border-color:transparent; }
  .mk.on.yapmadi{ background:var(--c-yapmadi); color:#fff; border-color:transparent; }
  .mk.on.gec{ background:var(--c-gec); color:#fff; border-color:transparent; }
  td.s-yapti{ background:rgba(46,204,113,0.16); }
  td.s-eksik{ background:rgba(245,196,0,0.16); }
  td.s-yapmadi{ background:rgba(239,68,68,0.18); }
  td.s-gec{ background:rgba(168,85,247,0.20); }
  .empty-note{ padding:36px; text-align:center; color:var(--muted); }

  /* Diyalog */
  .ov{ position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:100; display:flex; align-items:center; justify-content:center; padding:16px; overflow:auto; }
  .modal{ width:min(460px,100%); background:#15151b; border:1px solid rgba(255,255,255,0.16); border-radius:18px; padding:22px; box-shadow:0 20px 60px rgba(0,0,0,.6); }
  .modal h3{ font-size:1.2rem; margin-bottom:6px; }
  .modal p{ margin:6px 0 14px; color:#c9c9d1; font-size:0.93rem; }
  .modal .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .acts{ display:flex; justify-content:flex-end; gap:10px; margin-top:16px; flex-wrap:wrap; }
  .sep{ border-top:1px solid var(--line); margin:16px 0 4px; padding-top:12px; }
  .sep .acts{ justify-content:flex-start; margin-top:8px; }
  .toast{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:#20202a; border:1px solid rgba(255,255,255,0.2); padding:11px 18px; border-radius:12px; z-index:200; max-width:90vw; font-size:0.9rem; }
  .toast.ok{ border-color:var(--c-yapti); }
  .toast.err{ border-color:var(--c-yapmadi); }
  .spinner{ text-align:center; padding:60px; color:var(--muted); }

  @media (max-width:900px){ .summary{ grid-template-columns:1fr; } }
  @media (max-width:520px){ .topbar{ padding:10px 14px; } main{ padding:16px 12px 50px; } }
</style>

<script>
'use strict';
/* =====================================================================
   HOMEWORK CHART TOOL — TheGamifyClass.com
   The Agents / ClassClans / Who's Next ile AYNI Firebase projesini ve AYNI
   öğretmen kayıt defterini (admin/teachers/{uid}) kullanır.
   Veriler Realtime Database'de "homeworkchart/{öğretmenUid}" altında tutulur.
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyBxBzCkrJ9D8Uf9EcVGC80WcD116BtoUI4",
  authDomain: "the-agents-69182.firebaseapp.com",
  databaseURL: "https://the-agents-69182-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "the-agents-69182",
  storageBucket: "the-agents-69182.firebasestorage.app",
  messagingSenderId: "516259979836",
  appId: "1:516259979836:web:868a36a1551cb2e9d61939"
};
const ADMIN_UID = "eDTGhzccveNDugVZ9z0e2HmEhqr2";
const ROOT = 'homeworkchart';
const LOGO_SRC = 'assets/homework_chart_tool_logo.png';
const MAX_STUDENTS = 300;

/* ---------- Takvim: 21 Eylül 2026 haftası = 1. Hafta ---------- */
const START = new Date(2026, 8, 21);   // Pazartesi
const WEEKS = 41;                      // Haziran 2027 sonuna kadar
const MONTHS_TR = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const MON_SHORT = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const addDays = (d,n)=>new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const weekStart = n => addDays(START, 7*(n-1));
const fmtShort = d => d.getDate()+' '+MON_SHORT[d.getMonth()];
const weekRange = n => fmtShort(weekStart(n))+' – '+fmtShort(addDays(weekStart(n),6));
function fmtIso(iso){ if(!iso) return ''; const p=iso.split('-'); return p.length===3 ? p[2]+'.'+p[1]+'.'+p[0] : iso; }
function isoShort(iso){ if(!iso) return ''; const p=iso.split('-').map(Number); return p[2]+' '+MON_SHORT[p[1]-1]; }

const MONTH_LIST = (()=>{
  const out=[];
  for(let w=1; w<=WEEKS; w++){
    const d=weekStart(w), key=d.getFullYear()+'-'+d.getMonth();
    let m=out[out.length-1];
    if(!m || m.key!==key){ m={key,label:MONTHS_TR[d.getMonth()]+' '+d.getFullYear(),weeks:[]}; out.push(m); }
    m.weeks.push(w);
  }
  return out;
})();
function currentWeek(){
  const t=new Date(); const today=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  const days=Math.round((today-START)/86400000);
  const w=Math.floor(days/7)+1;
  return (w>=1 && w<=WEEKS) ? w : null;
}
function currentMonthKey(){
  const t=new Date(), key=t.getFullYear()+'-'+t.getMonth();
  if(MONTH_LIST.some(m=>m.key===key)) return key;
  return (t < START) ? MONTH_LIST[0].key : MONTH_LIST[MONTH_LIST.length-1].key;
}

/* ---------- Durumlar ---------- */
const ST = {
  yapti:   { label:'Yaptı',      w:1,   argb:'FF5CCB7C', font:'FF06301A' },
  eksik:   { label:'Eksik',      w:0.5, argb:'FFFFD84D', font:'FF3A2E00' },
  yapmadi: { label:'Yapmadı',    w:0,   argb:'FFEF6B6B', font:'FF3A0A0A' },
  gec:     { label:'Geç Teslim', w:1,   argb:'FFB18CE8', font:'FF250A45' }
};
const ST_KEYS = ['yapti','eksik','yapmadi','gec'];
const ST_COLOR = { yapti:'#2ecc71', eksik:'#f5c400', yapmadi:'#ef4444', gec:'#a855f7' };

/* ---------- Yardımcılar ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').toLocaleLowerCase('tr').replace(/\s+/g,' ').trim();
const app = document.getElementById('app');
const topActions = document.getElementById('topActions');
function toast(msg,kind){
  const t=document.createElement('div'); t.className='toast '+(kind||''); t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>t.remove(), kind==='err'?6000:2800);
}
function parseKey(k){ const m=/^w(\d+)h(\d)$/.exec(k); return {w:+m[1],h:+m[2]}; }
const hwTitle = k => { const p=parseKey(k); return p.w+'. Hafta '+p.h+'. Ödev'; };

function modal(html, opts={}){
  const ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML='<div class="modal" role="dialog" aria-modal="true">'+html+'</div>';
  document.body.appendChild(ov);
  let closed=false;
  const close=()=>{ if(closed) return; closed=true; document.removeEventListener('keydown',onKey); ov.remove(); if(opts.onClose) opts.onClose(); };
  const onKey=e=>{ if(e.key==='Escape') close(); };
  document.addEventListener('keydown',onKey);
  ov.addEventListener('mousedown',e=>{ if(e.target===ov) close(); });
  return { ov, el:ov.firstElementChild, close };
}
function confirmBox({title,msg,ok='Evet',cancel='Vazgeç',danger=false}){
  return new Promise(res=>{
    let answered=false;
    const m=modal('<h3>'+esc(title)+'</h3><p>'+msg+'</p><div class="acts"><button class="btn" data-x="0">'+esc(cancel)+'</button><button class="btn '+(danger?'danger':'primary')+'" data-x="1">'+esc(ok)+'</button></div>',
      { onClose:()=>{ if(!answered){ answered=true; res(false);} } });
    m.el.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{ answered=true; m.close(); res(b.dataset.x==='1'); });
  });
}
function friendly(e){
  if(!e) return 'Bilinmeyen hata.';
  if(e.code==='PERMISSION_DENIED' || /permission_denied/i.test(e.message||''))
    return 'Veritabanı izni yok. Firebase kurallarına "homeworkchart" bölümü henüz eklenmemiş olabilir.';
  return e.message || String(e);
}

/* ---------- Firebase ---------- */
let auth=null, db=null, fbOk=false;
try{
  firebase.initializeApp(firebaseConfig);
  auth=firebase.auth(); db=firebase.database(); fbOk=true;
}catch(e){ console.error('Firebase başlatılamadı',e); }

const S = { user:null, classes:{}, cid:null, data:null, month:null, unsub:[] };
let loginMsg='';
function clearListeners(){ S.unsub.forEach(f=>{ try{f();}catch(e){} }); S.unsub=[]; }
const base = () => ROOT+'/'+S.user.uid;
const cbase = () => base()+'/classes/'+S.cid;

/* =====================================================================
   GİRİŞ
   ===================================================================== */
function logoImg(cls){
  return '<img class="'+cls+'" src="'+LOGO_SRC+'" alt="Homework Chart Tool" onerror="this.onerror=null;this.src=\'assets/site_logo.png\'">';
}
function viewLogin(msg){
  clearListeners(); S.cid=null; S.data=null;
  topActions.innerHTML='';
  app.innerHTML='<div class="auth-wrap"><div class="panel auth-card">'+logoImg('auth-logo')+
    '<h2>Homework Chart Tool</h2><p class="sub">Sistemde kayıtlı e-posta ve şifrenle giriş yap.</p>'+
    (msg?'<div class="err">'+esc(msg)+'</div>':'')+
    '<form id="lf"><div class="field"><label for="em">E-posta</label><input id="em" type="email" autocomplete="username" required></div>'+
    '<div class="field"><label for="pw">Şifre</label><input id="pw" type="password" autocomplete="current-password" required></div>'+
    '<button class="btn primary" style="width:100%" type="submit" id="lb">Giriş Yap</button></form>'+
    '<p style="text-align:center;margin:14px 0 0"><button class="linkbtn" id="fp" type="button">Şifremi unuttum</button></p></div></div>';
  $('#lf').onsubmit=async e=>{
    e.preventDefault();
    const em=$('#em').value.trim(), pw=$('#pw').value;
    const b=$('#lb'); b.disabled=true; b.textContent='Giriş yapılıyor…';
    try{ await auth.signInWithEmailAndPassword(em,pw); }
    catch(err){
      b.disabled=false; b.textContent='Giriş Yap';
      const bad=['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email'];
      viewLogin(bad.includes(err.code)?'E-posta veya şifre hatalı.':(err.code==='auth/too-many-requests'?'Çok fazla deneme yapıldı. Biraz bekleyip tekrar dene.':friendly(err)));
    }
  };
  $('#fp').onclick=async()=>{
    const em=$('#em').value.trim();
    if(!em){ toast('Önce e-posta adresini yaz.','err'); return; }

function studentList(){
  const st=(S.data&&S.data.students)||{};
  return Object.keys(st).map(id=>({id,name:st[id].name||''})).sort((a,b)=>a.name.localeCompare(b.name,'tr'));
}
function visibleCols(w){
  const D=S.data||{};
  const hw2On=!(D.settings && D.settings.hw2Enabled===false);
  const r=[{k:'w'+w+'h1',w,h:1,off:false}];
  if(hw2On) r.push({k:'w'+w+'h2',w,h:2,off:!!(D.hw2off&&D.hw2off['w'+w])});
  return r;
}
function isGiven(k){
  const D=S.data||{};
  const i=D.hw&&D.hw[k];
  if(i && i.text && String(i.text).trim()) return true;
  const m=D.marks||{}, st=D.students||{};
  for(const sid in m){ if(st[sid] && m[sid] && m[sid][k]) return true; }
  return false;
}
function compute(){
  const D=S.data||{}, studs=studentList(), keys=[], colDone={};
  for(let w=1; w<=WEEKS; w++) visibleCols(w).forEach(c=>{ if(!c.off && isGiven(c.k)) keys.push(c.k); });
  const G=keys.length, cnt={yapti:0,eksik:0,yapmadi:0,gec:0,none:0}, per={};
  let doneAll=0, scoreAll=0;
  studs.forEach(s=>{
    let done=0, score=0;
    keys.forEach(k=>{
      const v=D.marks&&D.marks[s.id]&&D.marks[s.id][k];
      if(v && ST[v]){ cnt[v]++; score+=ST[v].w; if(v==='yapti'||v==='gec'){ done++; colDone[k]=(colDone[k]||0)+1; } }
      else cnt.none++;
    });
    per[s.id]={given:G,done,score,rate:G?score/G*100:0};
    doneAll+=done; scoreAll+=score;
  });
  const N=studs.length;
  return {G,keys,per,cnt,doneAll,N,studs,colDone,rate:(G&&N)?scoreAll/(G*N)*100:0};
}
const pct = v => (Math.round(v*10)/10).toString().replace('.',',')+'%';

function drawStats(cs){
  $('#statCards').innerHTML=
    '<div class="stat"><div class="n">'+cs.G+'</div><div class="l">Toplam verilen ödev sayısı</div><div class="s">Açıklaması yazılan / işaretlenen ödevler</div></div>'+

    '<div class="stat"><div class="n" style="color:var(--cyan)">'+pct(cs.rate)+'</div><div class="l">Sınıf teslim oranı</div><div class="s">Yaptı 1 · Geç 1 · Eksik 0,5 · Yapmadı 0</div></div>'+
    '<div class="stat"><div class="n">'+cs.N+'</div><div class="l">Öğrenci sayısı</div></div>';
  $('#donutBox').innerHTML=donutSvg(cs)+
    '<div class="legend">'+ST_KEYS.map(k=>'<span><i class="dot" style="background:'+ST_COLOR[k]+'"></i>'+ST[k].label+': <b>'+cs.cnt[k]+'</b></span>').join('')+'</div>'+
    '<div class="muted" style="font-size:0.75rem">İşaretlenmemiş: '+cs.cnt.none+'</div>';
}
function donutSvg(cs){
  const tot=ST_KEYS.reduce((a,k)=>a+cs.cnt[k],0), R=70, C=2*Math.PI*R;
  let segs='', off=0;
  if(tot>0){
    ST_KEYS.forEach(k=>{
      const v=cs.cnt[k]; if(!v) return;
      const len=v/tot*C;
      segs+='<circle cx="100" cy="100" r="'+R+'" fill="none" stroke="'+ST_COLOR[k]+'" stroke-width="30" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 100 100)"><title>'+ST[k].label+': '+v+'</title></circle>';
      off+=len;
    });
  }else{
    segs='<circle cx="100" cy="100" r="'+R+'" fill="none" stroke="#2a2a33" stroke-width="30"/>';
  }
  const center=tot>0
    ? '<text x="100" y="98" text-anchor="middle" fill="#e9e9ec" font-size="26" font-weight="700" font-family="Space Grotesk,sans-serif">'+pct(cs.rate)+'</text><text x="100" y="118" text-anchor="middle" fill="#8b8b93" font-size="11">teslim oranı</text>'
    : '<text x="100" y="105" text-anchor="middle" fill="#8b8b93" font-size="13">Veri yok</text>';
  return '<svg viewBox="0 0 200 200" role="img" aria-label="Ödev durumları dairesel grafiği">'+segs+center+'</svg>';
}

function drawTable(cs){

    }
  }));
  head+='<th class="endcol">Verilen Ödev</th><th class="endcol">Tamamlanan</th><th class="endcol">Teslim Oranı</th></tr>';

  wrap.scrollLeft=sl; wrap.scrollTop=st;

    };
    $('#hwra').onclick=async()=>{ m.close(); setHw2Global(false); };
  }
}

/* =====================================================================
   EXCEL: ŞABLON + İÇE AKTARMA
   ===================================================================== */
function downloadBlob(buf,filename){
  const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
const safeName = s => String(s||'sinif').replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,'-').replace(/[ığüşöçİĞÜŞÖÇ]/g,ch=>({'ı':'i','ğ':'g','ü':'u','ş':'s','ö':'o','ç':'c','İ':'I','Ğ':'G','Ü':'U','Ş':'S','Ö':'O','Ç':'C'}[ch])).slice(0,40)||'sinif';
async function downloadTemplate(){
  try{
    const wb=new ExcelJS.Workbook(), ws=wb.addWorksheet('Öğrenciler');
    ws.getColumn(1).width=42; ws.getColumn(3).width=60;
    const a1=ws.getCell('A1'); a1.value='Öğrenci Adı Soyadı';
    a1.font={bold:true}; a1.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFD9E8F5'}};
    a1.border={top:{style:'thin'},bottom:{style:'thin'},left:{style:'thin'},right:{style:'thin'}};
    ws.getCell('C1').value='A2\'den itibaren her satıra bir öğrenci adı soyadı yaz. A1 başlığını değiştirme.';
    ws.getCell('C1').font={italic:true,color:{argb:'FF777777'}};
    downloadBlob(await wb.xlsx.writeBuffer(),'ogrenci-listesi-ornek.xlsx');
  }catch(e){ toast('Şablon oluşturulamadı: '+friendly(e),'err'); }
}
async function importExcel(file){
  try{
    const wb=new ExcelJS.Workbook(); await wb.xlsx.load(await file.arrayBuffer());
    const ws=wb.worksheets[0]; if(!ws){ toast('Excel dosyasında sayfa bulunamadı.','err'); return; }
    const names=[];
    for(let r=2; r<=ws.rowCount; r++){
      const c=ws.getRow(r).getCell(1);
      const t=String(c.text!=null?c.text:(c.value||'')).replace(/\s+/g,' ').trim();
      if(t) names.push(t);
    }
    if(!names.length){ toast('A2 ve altında öğrenci adı bulunamadı.','err'); return; }
    const have=new Set(studentList().map(s=>norm(s.name)));
    const add={}; let added=0, skipped=0, cap=MAX_STUDENTS-have.size;
    for(const n of names){
      const key=norm(n);
      if(have.has(key)){ skipped++; continue; }
      if(added>=cap){ skipped++; continue; }
      have.add(key); add[db.ref().push().key]={name:n}; added++;
    }
    if(!added){ toast('Yeni öğrenci eklenmedi ('+skipped+' tekrar/fazla satır atlandı).','err'); return; }
    await db.ref(cbase()+'/students').update(add);
    toast(added+' öğrenci eklendi'+(skipped?', '+skipped+' satır atlandı (aynı isim).':'.'),'ok');
  }catch(e){ toast('Excel okunamadı. Dosyanın .xlsx olduğundan emin ol. '+friendly(e),'err'); }
}

/* =====================================================================
   EXCEL: ÖDEV DÖKÜMÜ
   ===================================================================== */
async function exportExcel(){
  if(!S.data){ return; }
  const cs=compute();
  if(!cs.N){ toast('Önce sınıfa öğrenci ekle.','err'); return; }
  if(!cs.G){ toast('Henüz verilmiş ödev yok. Bir ödev başlığına tıklayıp ödevi yaz ya da durum işaretle.','err'); return; }
  try{
    const D=S.data, meta=D.meta;
    // Son ödev verilen haftaya kadar tüm sütunlar
    let lastW=1; cs.keys.forEach(k=>{ lastW=Math.max(lastW,parseKey(k).w); });
    const cols=[]; for(let w=1; w<=lastW; w++) visibleCols(w).forEach(c=>{ if(!c.off) cols.push(c); });
    const nc=cols.length, cName=1, cFirst=2, cGiven=2+nc, cDone=3+nc, cRate=4+nc;
    const thin={style:'thin',color:{argb:'FF999999'}}, border={top:thin,bottom:thin,left:thin,right:thin};
    const wb=new ExcelJS.Workbook(); wb.creator='TheGamifyClass.com Homework Chart Tool';
    const ws=wb.addWorksheet('Ödev Dökümü',{views:[{state:'frozen',xSplit:1,ySplit:3}]});
    const centre={horizontal:'center',vertical:'middle',wrapText:true};

    // Satır 1: başlık
    ws.mergeCells(1,1,1,cRate);
    const t=ws.getCell(1,1); t.value=meta.name+' — '+(meta.school||'')+' — Ödev Dökümü';
    t.font={bold:true,size:14}; t.alignment={horizontal:'left',vertical:'middle'}; ws.getRow(1).height=26;

    // Satır 2: ay grupları, Satır 3: ödev başlıkları
    ws.getCell(2,1).value='Ad Soyad'; ws.mergeCells(2,1,3,1);
    let i=0;
    while(i<nc){
      const w=cols[i].w, mk=weekStart(w).getMonth()+'-'+weekStart(w).getFullYear(); let j=i;
      while(j+1<nc){ const w2=cols[j+1].w; if(weekStart(w2).getMonth()+'-'+weekStart(w2).getFullYear()!==mk) break; j++; }
      const d=weekStart(w);
      ws.getCell(2,cFirst+i).value=MONTHS_TR[d.getMonth()]+' '+d.getFullYear();
      if(j>i) ws.mergeCells(2,cFirst+i,2,cFirst+j);
      i=j+1;
    }
    cols.forEach((c,idx)=>{ const cell=ws.getCell(3,cFirst+idx); cell.value=c.w+'. Hafta '+c.h+'. Ödev'; });
    [['Verilen Ödev',cGiven],['Tamamlanan Ödev',cDone],['Teslim Oranı (%)',cRate]].forEach(([txt,c])=>{ ws.getCell(2,c).value=txt; ws.mergeCells(2,c,3,c); });
    for(let r=2; r<=3; r++) for(let c=1; c<=cRate; c++){
      const cell=ws.getCell(r,c); cell.font={bold:true}; cell.alignment=centre; cell.border=border;
      cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:(c>=cGiven?'FFD6DCE4':'FFE7EEF7')}};
    }
    ws.getRow(3).height=32;

    // Öğrenci satırları
    let r=4;
    cs.studs.forEach(s=>{
      const nameCell=ws.getCell(r,1); nameCell.value=s.name; nameCell.border=border; nameCell.alignment={vertical:'middle'};
      cols.forEach((c,idx)=>{
        const cell=ws.getCell(r,cFirst+idx), v=D.marks&&D.marks[s.id]&&D.marks[s.id][c.k];
        cell.border=border; cell.alignment=centre;
        if(v&&ST[v]){ cell.value=ST[v].label; cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:ST[v].argb}}; cell.font={color:{argb:ST[v].font},bold:true}; }
      });
      const p=cs.per[s.id];
      [[cGiven,p.given],[cDone,p.done],[cRate,Math.round(p.rate*10)/10]].forEach(([c,val])=>{
        const cell=ws.getCell(r,c); cell.value=val; cell.border=border; cell.alignment=centre; cell.font={bold:true};
        if(c===cRate) cell.numFmt='0.0"%"';
      });
      r++;
    });

    // Sınıf özeti satırı
    const sumRow=r;
    ws.getCell(sumRow,1).value='SINIF TOPLAMI';
    cols.forEach((c,idx)=>{ ws.getCell(sumRow,cFirst+idx).value=isGiven(c.k)?((cs.colDone[c.k]||0)+' / '+cs.N):'—'; });
    ws.getCell(sumRow,cGiven).value=cs.G; ws.getCell(sumRow,cDone).value=cs.doneAll;
    ws.getCell(sumRow,cRate).value=Math.round(cs.rate*10)/10; ws.getCell(sumRow,cRate).numFmt='0.0"%"';
    for(let c=1; c<=cRate; c++){ const cell=ws.getCell(sumRow,c); cell.font={bold:true}; cell.border=border; cell.alignment=c===1?{vertical:'middle'}:centre; cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFD6DCE4'}}; }

    // Açıklamalar
    let lr=sumRow+2;
    ws.getCell(lr,1).value='Renk anahtarı ve hesaplama:'; ws.getCell(lr,1).font={bold:true}; lr++;
    const legend=[['yapti','Yaptı = 1 puan'],['eksik','Eksik = 0,5 puan'],['yapmadi','Yapmadı = 0 puan'],['gec','Geç Teslim = 1 puan']];
    legend.forEach(([k,txt])=>{
      const c=ws.getCell(lr,1); c.value=txt; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:ST[k].argb}}; c.font={bold:true,color:{argb:ST[k].font}}; c.border=border; lr++;
    });
    ws.getCell(lr,1).value='Tamamlanan ödev = Yaptı + Geç Teslim sayısı. Teslim oranı = toplam puan ÷ verilen ödev × 100.';
    ws.getCell(lr,1).font={italic:true,color:{argb:'FF666666'}};

    ws.getColumn(1).width=30;
    for(let c=cFirst; c<=cRate; c++) ws.getColumn(c).width=(c>=cGiven?16:14);

    // 2. sayfa: ödev açıklamaları
    const w2=wb.addWorksheet('Ödev Açıklamaları');
    w2.columns=[{header:'Hafta',width:10},{header:'Ödev',width:10},{header:'Hafta Aralığı',width:22},{header:'Verilen Ödev',width:70},{header:'Teslim Başlangıç',width:18},{header:'Teslim Bitiş',width:18}];
    w2.getRow(1).font={bold:true}; w2.getRow(1).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFE7EEF7'}};
    cols.forEach(c=>{
      const info=(D.hw&&D.hw[c.k])||{};
      if(!isGiven(c.k)) return;
      const row=w2.addRow([c.w+'. Hafta',c.h+'. Ödev',weekRange(c.w),info.text||'',fmtIso(info.start),fmtIso(info.end)]);
      row.getCell(4).alignment={wrapText:true,vertical:'top'};
    });

    const d=new Date(), stamp=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
    downloadBlob(await wb.xlsx.writeBuffer(),safeName(meta.name)+'-odev-dokumu-'+stamp+'.xlsx');
    toast('Excel dosyası indirildi.','ok');
  }catch(e){ console.error(e); toast('Excel oluşturulamadı: '+friendly(e),'err'); }
}
</script>
