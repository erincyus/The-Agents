<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teşekkürler | GamifyClass.com</title>
<link rel="icon" href="assets/site_logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --neutral-bg:#0a0a0c; --card-bg:#131318; --neutral-text:#e9e9ec; --neutral-muted:#9a9aa1;
    --brand-red:#e43550; --brand-cyan:#38d9e0;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--neutral-bg); color:var(--neutral-text); font-family:'Inter', system-ui, sans-serif; text-align:center;
  }
  a{ text-decoration:none; }
  .card{
    background:var(--card-bg); border:1px solid rgba(255,255,255,0.07); border-radius:18px;
    padding:48px 36px; max-width:440px; margin:24px;
  }
  .check{ font-size:2.6rem; margin-bottom:14px; }
  h1{ font-family:'Space Grotesk', sans-serif; font-size:1.5rem; margin:0 0 12px; }
  p{ color:var(--neutral-muted); margin:0 0 26px; font-size:0.98rem; }
  .cta-btn{
    display:inline-block; padding:12px 28px; border-radius:999px;
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:0.92rem;
    background:linear-gradient(90deg, var(--brand-red), var(--brand-cyan)); color:#0a0a0c;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>Mesajınız gönderildi!</h1>
    <p>İletişim talebiniz bize ulaştı. En kısa sürede size dönüş yapacağız.</p>
    <a class="cta-btn" href="index.html">Ana Sayfaya Dön</a>
  </div>
</body>
</html>
